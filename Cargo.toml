[workspace]
resolver = "2"
members = [
  "apps/skit",
  "apps/skit-cli",
  "crates/core",
  "crates/nodes",
  "crates/engine",
  "crates/api",
  "crates/plugin-wasm",
  "crates/plugin-native",
  "sdks/plugin-sdk/wasm/rust",
  "sdks/plugin-sdk/native",
]
exclude = ["examples", "tests", "plugins"]

[workspace.dependencies]
streamkit-core = { version = "0.2", path = "crates/core" }
streamkit-nodes = { version = "0.2", path = "crates/nodes" }
streamkit-engine = { version = "0.2", path = "crates/engine" }
streamkit-server = { version = "0.2", path = "apps/skit" }
streamkit-client = { version = "0.1", path = "apps/skit-cli" }
streamkit-api = { version = "0.2", path = "crates/api" }
streamkit-plugin-wasm = { version = "0.2", path = "crates/plugin-wasm" }
streamkit-plugin-native = { version = "0.2", path = "crates/plugin-native" }
streamkit-plugin-sdk-wasm = { version = "0.1", path = "sdks/plugin-sdk/wasm/rust" }
streamkit-plugin-sdk-native = { version = "0.2", path = "sdks/plugin-sdk/native" }

tracing = "0.1.44"

tokio = "1.52"
tokio-util = "0.7.18"

async-trait = "0.1.89"
thiserror = "2.0"

bytes = "1.11.0"

futures = "0.3.31"

serde = { version = "1.0.228", features = ["derive", "rc"] }
serde-saphyr = "0.0.26"
serde_json = "1.0"
indexmap = { version = "2.14", features = ["serde"] }

opentelemetry = "0.31.0"

criterion = { version = "0.5", default-features = false }

# Profile settings
[profile.release]
debug = 1 # Include line tables for better stack traces in profiling

# Optimised release build — use `cargo build --profile release-lto`.
# All official Dockerfiles use this profile for the skit binary.
[profile.release-lto]
inherits = "release"
lto = "thin"       # Parallel cross-crate LTO — nearly as effective as "fat" but links much faster
codegen-units = 16 # Allow parallel LLVM codegen/LTO (thin LTO handles cross-unit optimisation)

[profile.dev]
debug = 2 # Full debug info for development profiling

# Pure-Rust codec crates are unusably slow in debug mode (~100x slower than
# release) because they rely on SIMD auto-vectorisation and inlining.
# Always compile them with full optimisations so that debug builds can still
# encode/decode video in real time.  The dependency crates (v_frame,
# av-scenechange, etc.) are included because rav1e calls into them on hot
# paths — optimising only the top-level crate is not sufficient.
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.rav1d]
opt-level = 3
[profile.dev.package.v_frame]
opt-level = 3
[profile.dev.package.av-scenechange]
opt-level = 3
[profile.dev.package.maybe-rayon]
opt-level = 3

# Fast development profiling — no LTO, incremental compilation.
# Inherits dev's per-package overrides (rav1e, rav1d at opt-level 3) and
# incremental compilation.  Uses opt-level 2 so profiles are meaningful
# (inlining, vectorisation) while skipping the expensive LTO link step.
# First build populates the cache; subsequent rebuilds are incremental.
[profile.dev-profiling]
inherits = "dev"
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
# missing_debug_implementations = "warn"
# missing_copy_implementations = "warn"
# missing_docs = "warn"

[workspace.lints.clippy]
# Categories
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Safety
unwrap_used = "warn"
expect_used = "warn"
# Complexity
cognitive_complexity = "warn"
# Math
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Allow-list (Noise reduction)
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

