[package]
name = "streamkit-plugin-native-common"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Shared FFI bindings and model wrappers for StreamKit native plugins"
publish = false

[features]
default = []
# Silero VAD wrapper (ONNX Runtime); kept optional so TTS plugins that only
# need the sherpa-onnx FFI don't pay for the ort/ndarray dependency tree.
silero-vad = ["dep:ort", "dep:ndarray"]

[dependencies]
ort = { version = "=2.0.0-rc.10", optional = true }
ndarray = { version = "0.16", optional = true }

[lints.clippy]
# Categories
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Safety
unwrap_used = "warn"
expect_used = "warn"
# Complexity
cognitive_complexity = "warn"
# Math
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Allow-list (Noise reduction)
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
