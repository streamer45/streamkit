[package]
name = "servo-plugin-native"
version = "0.1.1"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "servo_web"
# `rlib` (in addition to the `cdylib` the host loads) lets the
# integration test in `tests/` link the crate and exercise the real
# Servo engine through the public `send_work` API.
crate-type = ["cdylib", "rlib"]

[dependencies]
streamkit-plugin-sdk-native = { path = "../../../sdks/plugin-sdk/native" }
servo = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "rayon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
url = "2"
euclid = "0.22"
dpi = "0.1"
tracing = "0.1"

# Servo pulls in jemalloc via servo-allocator.  By default jemalloc uses
# initial-exec TLS which requires static TLS slots — these are allocated
# at process start and cannot grow.  When the plugin is dlopen'd at
# runtime the static TLS space is already committed, causing
# "cannot allocate memory in static TLS block".
# Enabling `disable_initial_exec_tls` makes jemalloc use the slower but
# dlopen-safe global-dynamic TLS model.
tikv-jemalloc-sys = { version = "0.6", features = ["disable_initial_exec_tls"] }

[dev-dependencies]
# The cross-session leak integration test drives the real Servo engine,
# which has no clean global-shutdown path: at process exit mozjs' C++
# destructors race the still-live renderer thread and SIGSEGV.  The test
# calls `libc::_exit` after asserting to bypass that teardown.
libc = "0.2"

[lints.clippy]
# Categories
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Safety
unwrap_used = "warn"
expect_used = "warn"
# Complexity
cognitive_complexity = "warn"
# Math
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Allow-list (Noise reduction)
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
