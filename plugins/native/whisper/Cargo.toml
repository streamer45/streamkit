[package]
name = "whisper-plugin-native"
version = "0.3.0"
edition = "2021"
license = "MPL-2.0"

[lib]
name = "whisper"
crate-type = ["cdylib"]

[dependencies]
streamkit-plugin-sdk-native = { path = "../../../sdks/plugin-sdk/native" }
streamkit-plugin-native-common = { path = "../common", features = ["silero-vad"] }
whisper-rs = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[features]
default = []
# Enables CUDA-accelerated inference via whisper.cpp's CUDA backend. Requires a
# CUDA toolkit at build time; the marketplace cuda bundle is built with this on.
cuda = ["whisper-rs/cuda"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.clippy]
# Categories
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Safety
unwrap_used = "warn"
expect_used = "warn"
# Complexity
cognitive_complexity = "warn"
# Math
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Allow-list (Noise reduction)
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
