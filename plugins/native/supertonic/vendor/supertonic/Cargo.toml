[package]
name = "supertonic-vendor"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "supertonic_vendor"

[dependencies]
ort = { version = "=2.0.0-rc.10", features = ["ndarray"] }
ndarray = { version = "0.16", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
hound = "3.5"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
unicode-normalization = "0.1"
regex = "1.10"
libc = "0.2"
