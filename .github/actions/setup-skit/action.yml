name: Setup StreamKit CI
description: Common setup prelude for StreamKit CI jobs

inputs:
  rust-cache-key:
    description: "Shared key for sccache and rust-cache"
    required: true
  rust-cache-workspaces:
    description: "Rust cache workspaces mapping (e.g. '. -> target/coverage')"
    required: false
    default: ""
  rust-components:
    description: "Extra Rust toolchain components (e.g. 'llvm-tools-preview')"
    required: false
    default: ""
  skip-ui-build:
    description: "Skip Bun setup and UI build"
    required: false
    default: "false"
  runs-on-self-hosted:
    description: "Skip free-disk and apt steps (for self-hosted runners)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Free disk space
      if: inputs.runs-on-self-hosted != 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false

    - name: Setup Bun
      if: inputs.skip-ui-build != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.5"

    - name: Build UI
      if: inputs.skip-ui-build != 'true'
      working-directory: ./ui
      shell: bash
      run: |
        bun install --frozen-lockfile
        bun run build

    - name: Install system dependencies
      if: inputs.runs-on-self-hosted != 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0"
        components: ${{ inputs.rust-components }}

    - name: Restore sccache cache
      if: inputs.runs-on-self-hosted != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/sccache
        key: sccache-${{ inputs.rust-cache-key }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-${{ inputs.rust-cache-key }}-${{ runner.os }}-

    - uses: mozilla-actions/sccache-action@v0.0.9

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache-key }}
        workspaces: ${{ inputs.rust-cache-workspaces }}
        save-if: ${{ github.ref == 'refs/heads/main' }}
        cache-on-failure: true
