name: Setup StreamKit CI
description: Common setup prelude for StreamKit CI jobs

inputs:
  rust-cache-key:
    description: "Key for sccache cache (per-job)"
    required: true
  rust-cache-shared-key:
    description: "Shared key for Swatinem/rust-cache (jobs that compile similar artifacts can share a key)"
    required: false
    default: ""
  rust-cache-workspaces:
    description: "Rust cache workspaces mapping (e.g. '. -> target/coverage')"
    required: false
    default: ""
  rust-cache-save-if:
    description: "Condition for saving the rust-cache (default: only on main)"
    required: false
    default: "${{ github.ref == 'refs/heads/main' }}"
  rust-components:
    description: "Extra Rust toolchain components (e.g. 'llvm-tools-preview')"
    required: false
    default: ""
  skip-ui-build:
    description: "Skip Bun setup and UI build"
    required: false
    default: "false"
  skip-sccache:
    description: "Skip sccache setup and cache (for jobs that set RUSTC_WRAPPER='')"
    required: false
    default: "false"
  runs-on-self-hosted:
    description: "Skip free-disk and apt steps (for self-hosted runners)"
    required: false
    default: "false"
  free-disk-aggressive:
    description: "Also remove large packages and swap (needed for coverage)"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Multiple runner services on the same host share the default CARGO_HOME,
    # so a concurrent job's rust-cache post-step ("Cleaning cargo registry")
    # can delete registry sources mid-compile. They also share one sccache
    # daemon. Isolate CARGO_HOME per runner and compile without sccache.
    - name: Isolate Cargo home (self-hosted)
      if: inputs.runs-on-self-hosted == 'true'
      shell: bash
      run: |
        echo "CARGO_HOME=${RUNNER_TEMP}/cargo-home" >> "$GITHUB_ENV"
        echo "${RUNNER_TEMP}/cargo-home/bin" >> "$GITHUB_PATH"
        echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"

    - name: Free disk space
      if: inputs.runs-on-self-hosted != 'true'
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: ${{ inputs.free-disk-aggressive == 'true' }}
        docker-images: true
        swap-storage: ${{ inputs.free-disk-aggressive == 'true' }}

    - name: Setup Bun
      if: inputs.skip-ui-build != 'true'
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: "1.3.14"

    - name: Build UI
      if: inputs.skip-ui-build != 'true'
      working-directory: ./ui
      shell: bash
      run: |
        bun install --frozen-lockfile
        bun run build

    - name: Install system dependencies
      if: inputs.runs-on-self-hosted != 'true'
      shell: bash
      # libclang-dev is needed by bindgen (env-libvpx-sys "generate" feature);
      # the free-disk-aggressive step removes the runner's preinstalled llvm.
      run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm libclang-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.95.0"
        components: ${{ inputs.rust-components }}

    - name: Restore sccache cache
      if: inputs.skip-sccache != 'true' && inputs.runs-on-self-hosted != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ~/.cache/sccache
        key: sccache-${{ inputs.rust-cache-key }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          sccache-${{ inputs.rust-cache-key }}-${{ runner.os }}-

    - name: Start sccache
      if: inputs.skip-sccache != 'true' && inputs.runs-on-self-hosted != 'true'
      uses: mozilla-actions/sccache-action@v0.0.9

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache-shared-key || inputs.rust-cache-key }}
        workspaces: ${{ inputs.rust-cache-workspaces }}
        save-if: ${{ inputs.rust-cache-save-if }}
        cache-on-failure: true
