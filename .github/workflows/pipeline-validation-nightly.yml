name: Pipeline Validation (Nightly Slow)

# The PR/push pipeline-validation job skips samples marked `slow = true`
# (realtime-paced showcases and slow SW AV1 encodes) to keep CI fast. This
# nightly run exercises them with PIPELINE_INCLUDE_SLOW=1 on SW codecs.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  pipeline-validation-slow:
    name: Pipeline Validation (Slow SW Samples)
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-e2e-pipeline-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-e2e-pipeline-${{ runner.os }}-

      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm libclang-dev cmake ninja-build yasm meson ffmpeg

      - name: Build and install SVT-AV1 from source (v4.1.0)
        run: |
          cd /tmp
          git clone --depth 1 --branch v4.1.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cd SVT-AV1
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          cmake --build build -j"$(nproc)"
          sudo cmake --install build
          sudo ldconfig

      - name: Build skit
        # Release build: software AV1 (rav1e) encodes ~16x faster than realtime
        # here, so the realtime-paced showcase samples finish near their content
        # duration instead of blowing past the harness's request timeout.
        run: cargo build -p streamkit-server --bin skit --release --features "svt_av1 dav1d_static"

      - name: Start skit server
        run: |
          SK_SERVER__ADDRESS=127.0.0.1:4545 ./target/release/skit &
          HEALTHY=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4545/healthz > /dev/null 2>&1; then
              echo "skit is healthy"
              HEALTHY=1
              break
            fi
            sleep 1
          done
          if [ "$HEALTHY" -ne 1 ]; then
            echo "ERROR: skit did not become healthy within 30s"
            exit 1
          fi

      - name: Validate official oneshot samples (SW codecs, including slow)
        run: |
          cd tests/pipeline-validation
          PIPELINE_INCLUDE_SLOW=1 PIPELINE_TEST_URL=http://127.0.0.1:4545 \
            cargo test --test oneshot -- --test-threads=1
