name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SHERPA_ONNX_VERSION: "1.12.17"

jobs:
  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --locked -p streamkit-server --bin skit --release --features "moq"
          cargo build --locked -p streamkit-client --bin skit-cli --release

      - name: Strip binaries
        run: |
          strip target/release/skit
          strip target/release/skit-cli

      - name: Prepare release directory
        run: |
          mkdir -p streamkit-${{ github.ref_name }}/plugins/{wasm,native}
          mkdir -p streamkit-${{ github.ref_name }}/samples
          cp target/release/skit streamkit-${{ github.ref_name }}/
          cp target/release/skit-cli streamkit-${{ github.ref_name }}/
          cp LICENSE streamkit-${{ github.ref_name }}/
          cp README.md streamkit-${{ github.ref_name }}/
          cp DOCKER.md streamkit-${{ github.ref_name }}/
          cp NOTICE streamkit-${{ github.ref_name }}/
          cp -r LICENSES streamkit-${{ github.ref_name }}/
          cp docker-skit.toml streamkit-${{ github.ref_name }}/
          cp docker-skit-gpu.toml streamkit-${{ github.ref_name }}/
          cp samples/skit.toml streamkit-${{ github.ref_name }}/samples/skit.toml
          cp -r samples/pipelines streamkit-${{ github.ref_name }}/samples/

      - name: Create tarball
        run: |
          tar -czf streamkit-${{ github.ref_name }}-linux-x64.tar.gz streamkit-${{ github.ref_name }}/

      - name: Generate checksum
        run: |
          sha256sum streamkit-${{ github.ref_name }}-linux-x64.tar.gz > streamkit-${{ github.ref_name }}-linux-x64.tar.gz.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            streamkit-${{ github.ref_name }}-linux-x64.tar.gz
            streamkit-${{ github.ref_name }}-linux-x64.tar.gz.sha256

  build-marketplace:
    name: Build Marketplace Bundles
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libclang-dev wget libopenblas-dev zstd minisign patchelf

      - name: Install sherpa-onnx
        run: |
          cd /tmp
          wget https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared.tar.bz2
          tar xf sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared.tar.bz2
          sudo cp -r sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared/lib/* /usr/local/lib/
          sudo cp -r sherpa-onnx-v${SHERPA_ONNX_VERSION}-linux-x64-shared/include/* /usr/local/include/
          sudo ldconfig

      - name: Build CTranslate2
        run: |
          git clone --depth 1 --recurse-submodules --branch v4.5.0 https://github.com/OpenNMT/CTranslate2.git
          cd CTranslate2
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DWITH_CUDA=OFF \
                -DWITH_MKL=OFF \
                -DWITH_OPENBLAS=ON \
                -DOPENMP_RUNTIME=COMP \
                -DBUILD_CLI=OFF \
                ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            plugins/native/whisper
            plugins/native/kokoro
            plugins/native/piper
            plugins/native/matcha
            plugins/native/pocket-tts
            plugins/native/sensevoice
            plugins/native/nllb
            plugins/native/vad
            plugins/native/helsinki
          cache-on-failure: true

      - name: Build official plugins
        run: |
          bash scripts/marketplace/build_official_plugins.sh

      - name: Write minisign key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY}" ]; then
            echo "MINISIGN_SECRET_KEY is not set"
            exit 1
          fi
          echo "${MINISIGN_SECRET_KEY}" > /tmp/streamkit.key
          chmod 600 /tmp/streamkit.key

      - name: Build registry artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/marketplace/build_registry.py \
            --plugins marketplace/official-plugins.json \
            --version "${VERSION}" \
            --bundle-base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" \
            --registry-base-url "https://${{ github.repository_owner }}.github.io/streamkit/registry" \
            --bundles-out dist/bundles \
            --registry-out dist/registry \
            --signing-key /tmp/streamkit.key

      - name: Verify marketplace bundle portability
        run: |
          python3 scripts/marketplace/verify_bundles.py \
            --plugins marketplace/official-plugins.json \
            --bundles dist/bundles

      - name: Upload marketplace bundles
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-bundles
          path: dist/bundles/*.tar.zst

      - name: Upload registry metadata
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-registry
          path: dist/registry/**

  create-release:
    name: Create GitHub Release
    needs: [build-linux-x64, build-marketplace]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Extract version tag
          VERSION="${{ github.ref_name }}"

          # Simple changelog from git log (can be enhanced with git-cliff later)
          echo "## What's Changed" > changelog.md
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD >> changelog.md
          else
            echo "- Initial release" >> changelog.md
          fi

          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" >> changelog.md

          cat changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/streamkit-*.tar.gz
            artifacts/**/streamkit-*.tar.gz.sha256
            artifacts/**/marketplace-bundles/*.tar.zst
          body_path: changelog.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-registry:
    name: Publish Registry (PR)
    needs: [build-marketplace]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Download registry artifact
        uses: actions/download-artifact@v4
        with:
          name: marketplace-registry
          path: dist/registry

      - name: Update docs registry folder
        run: |
          rm -rf docs/public/registry
          mkdir -p docs/public/registry
          cp -R dist/registry/* docs/public/registry/

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "registry/${{ github.ref_name }}"
          title: "chore(registry): publish marketplace registry for ${{ github.ref_name }}"
          commit-message: "chore(registry): publish marketplace registry for ${{ github.ref_name }}"
          body: |
            Automated registry metadata update for `${{ github.ref_name }}`.
          base: main
