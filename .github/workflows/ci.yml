name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Cancel superseded runs on the same PR / branch so the single
# self-hosted GPU runner isn't blocked by stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Change detection ----------
  changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/**'
              - 'codecov.yml'
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'sdks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - '.cargo/config.toml'
            ui:
              - 'ui/**'
            plugins:
              - 'plugins/native/**'
            e2e:
              - 'e2e/**'

  # ---------- Sub-workflows ----------
  skit:
    name: Skit
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/skit.yml
    # Reusable workflows don't inherit secrets by default; pass them
    # through so the Coverage job can read CODECOV_TOKEN.
    secrets: inherit

  ui:
    name: UI
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml
    secrets: inherit

  plugins:
    name: Plugins
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/plugins.yml

  e2e:
    name: E2E
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # ---------- Always-run checks ----------
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v6

  # ---------- Gate ----------
  # This is the ONLY job that should be a required status check in branch
  # protection. It aggregates results from all conditional sub-workflows so
  # that skipped jobs (due to path filtering) never block merge.
  # See CONTRIBUTING.md § "CI gate and branch protection" for details.
  all-checks:
    name: All Checks Passed
    if: always()
    runs-on: ubuntu-22.04
    needs: [changes, skit, ui, plugins, e2e, reuse]
    permissions:
      statuses: read
    steps:
      - name: Verify Codecov thresholds
        # Only poll when at least one coverage upload was attempted.
        if: needs.skit.result == 'success' || needs.ui.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          max_attempts=30
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Attempt $attempt/$max_attempts"

            codecov=$(gh api "/repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context | startswith("codecov/"))]')
            count=$(echo "$codecov" | jq 'length')

            if [[ "$count" -eq 0 ]]; then
              echo "No Codecov statuses found yet."
              echo "::endgroup::"
              sleep "$delay"
              continue
            fi

            echo "$codecov" | jq -r '.[] | "  \(.context): \(.state)"'

            # Fail immediately on any threshold violation.
            failed=$(echo "$codecov" \
              | jq '[.[] | select(.state == "failure" or .state == "error")] | length')
            if [[ "$failed" -gt 0 ]]; then
              echo "::endgroup::"
              echo ""
              echo "::error::Codecov threshold violation(s):"
              echo "$codecov" \
                | jq -r '.[] | select(.state == "failure" or .state == "error")
                          | "  \(.context): \(.description)"'
              exit 1
            fi

            # Keep waiting while any status is still pending.
            pending=$(echo "$codecov" \
              | jq '[.[] | select(.state == "pending")] | length')
            if [[ "$pending" -eq 0 ]]; then
              echo "::endgroup::"
              echo "All Codecov statuses passed."
              exit 0
            fi

            echo "$pending status(es) still pending."
            echo "::endgroup::"
            sleep "$delay"
          done

          echo "::warning::Codecov statuses did not resolve within 5 min — skipping enforcement."

      - name: Verify results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=0
          echo "::group::Job results"
          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            printf '  %-10s %s\n' "$job" "$result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::$job: $result"
              failed=1
            fi
          done
          echo "::endgroup::"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
