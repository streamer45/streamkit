name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Cancel superseded runs on the same PR / branch so the single
# self-hosted GPU runner isn't blocked by stale jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Change detection ----------
  changes:
    name: Detect Changes
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      rust: ${{ steps.filter.outputs.rust }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/**'
              - 'codecov.yml'
            rust:
              - 'crates/**'
              - 'apps/**'
              - 'sdks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - '.cargo/config.toml'
            ui:
              - 'ui/**'
            plugins:
              - 'plugins/native/**'
            e2e:
              - 'e2e/**'

  # ---------- Sub-workflows ----------
  skit:
    name: Skit
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/skit.yml
    # Reusable workflows don't inherit secrets by default; pass them
    # through so the Coverage job can read CODECOV_TOKEN.
    secrets: inherit

  ui:
    name: UI
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/ui.yml
    secrets: inherit

  plugins:
    name: Plugins
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.plugins == 'true' ||
      needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/plugins.yml

  e2e:
    name: E2E
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.ui == 'true' ||
      needs.changes.outputs.e2e == 'true'
    uses: ./.github/workflows/e2e.yml

  # ---------- Always-run checks ----------
  reuse:
    name: REUSE Compliance
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v6

  # ---------- Gate ----------
  # This is the ONLY job that should be a required status check in branch
  # protection. It aggregates results from all conditional sub-workflows so
  # that skipped jobs (due to path filtering) never block merge.
  # See CONTRIBUTING.md § "CI gate and branch protection" for details.
  all-checks:
    name: All Checks Passed
    if: always()
    runs-on: ubuntu-22.04
    needs: [changes, skit, ui, plugins, e2e, reuse]
    permissions:
      checks: read
    steps:
      - name: Verify Codecov thresholds
        # Only poll when at least one coverage upload was attempted.
        if: needs.skit.result == 'success' || needs.ui.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          max_attempts=30
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            echo "::group::Attempt $attempt/$max_attempts"

            # Codecov publishes check runs incrementally; wait for the suite
            # to complete before evaluating its runs.
            suite=$(gh api \
              "/repos/$REPO/commits/$SHA/check-suites?per_page=100" \
              --jq '[.check_suites[] | select(.app.slug == "codecov")]
                    | sort_by(.updated_at) | last')
            suite_id=$(echo "$suite" | jq -r '.id // empty')
            suite_status=$(echo "$suite" | jq -r '.status // empty')

            if [[ -z "$suite_id" ]]; then
              echo "No Codecov check suite found yet."
              echo "::endgroup::"
              sleep "$delay"
              continue
            fi

            if [[ "$suite_status" != "completed" ]]; then
              echo "Latest Codecov check suite is $suite_status."
              echo "::endgroup::"
              sleep "$delay"
              continue
            fi

            codecov=$(gh api \
              "/repos/$REPO/check-suites/$suite_id/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name | startswith("codecov/"))]')
            count=$(echo "$codecov" | jq 'length')

            if [[ "$count" -eq 0 ]]; then
              echo "No Codecov check runs found yet."
              echo "::endgroup::"
              sleep "$delay"
              continue
            fi

            echo "$codecov" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "pending")"'

            # Fail immediately on any threshold violation.
            failed=$(echo "$codecov" \
              | jq '[.[] | select(
                  .conclusion == "failure" or
                  .conclusion == "cancelled" or
                  .conclusion == "timed_out" or
                  .conclusion == "action_required" or
                  .conclusion == "startup_failure"
                )] | length')
            if [[ "$failed" -gt 0 ]]; then
              echo "::endgroup::"
              echo ""
              echo "::error::Codecov threshold violation(s):"
              echo "$codecov" \
                | jq -r '.[] | select(
                            .conclusion == "failure" or
                            .conclusion == "cancelled" or
                            .conclusion == "timed_out" or
                            .conclusion == "action_required" or
                            .conclusion == "startup_failure"
                          ) | "  \(.name): \(.output.title // .conclusion)"'
              exit 1
            fi

            # Keep waiting while any check run is still pending.
            pending=$(echo "$codecov" \
              | jq '[.[] | select(.status != "completed")] | length')
            if [[ "$pending" -eq 0 ]]; then
              echo "::endgroup::"
              echo "All Codecov check runs passed."
              exit 0
            fi

            echo "$pending check run(s) still pending."
            echo "::endgroup::"
            sleep "$delay"
          done

          echo "::warning::Codecov check runs did not resolve within 5 min — skipping enforcement."

      - name: Verify results
        if: always()
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=0
          echo "::group::Job results"
          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            printf '  %-10s %s\n' "$job" "$result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::$job: $result"
              failed=1
            fi
          done
          echo "::endgroup::"

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
