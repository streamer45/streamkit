name: Skit CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-skit-lint-${{ runner.os }}-

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p streamkit-server --all-targets --features "moq" -- -D warnings
          cargo clippy --locked -p streamkit-server --all-targets --features "mcp" -- -D warnings

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-skit-test-${{ runner.os }}-

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Run tests (GPU tests run separately on self-hosted runner)
        run: |
          cargo test --locked --workspace -- --skip gpu_tests::
          cargo test --locked -p streamkit-server --features "moq"
          cargo test --locked -p streamkit-server --features "mcp"

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    # Coverage is informational during the initial rollout; do not block
    # `all-checks` if it fails. See codecov.yml for the ratcheting plan.
    continue-on-error: true
    env:
      # Isolate from the lint/test shared rust-cache; instrumented builds
      # would otherwise poison that cache for non-coverage jobs.
      CARGO_LLVM_COV_TARGET_DIR: target/coverage
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skit-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov --workspace --no-report nextest -- --skip gpu_tests::
          cargo llvm-cov --no-report nextest -p streamkit-server --features "moq"
          cargo llvm-cov --no-report nextest -p streamkit-server --features "mcp"
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-gpu:
    name: Test (GPU)
    # Skip for fork PRs — self-hosted runners must not execute untrusted code.
    # NOTE: we check `github.event.pull_request == null` instead of
    # `github.event_name != 'pull_request'` because this workflow is invoked
    # via `workflow_call`, which sets event_name to "workflow_call" regardless
    # of the original trigger, making the event_name check always true.
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvpx-dev nasm cmake pkg-config libopus-dev libva-dev libgbm-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skit-gpu
          cache-on-failure: true

      - name: Run GPU tests
        env:
          # The self-hosted runner runs Ubuntu 24.04 which ships libvpx 1.14.0,
          # but env-libvpx-sys 5.1.3 only has pre-generated FFI bindings up to
          # 1.13.0.  Setting VPX_LIB_DIR bypasses pkg-config version detection
          # and VPX_VERSION selects the 1.13.0 bindings (backward-compatible).
          VPX_LIB_DIR: /usr/lib/x86_64-linux-gnu
          VPX_INCLUDE_DIR: /usr/include
          VPX_VERSION: "1.13.0"
          # Ubuntu's nvidia-cuda-toolkit installs headers to /usr/include, not
          # /usr/local/cuda/include.  Tell shiguredo_nvcodec where to find them.
          CUDA_INCLUDE_PATH: /usr/include
          # bindgen (used by shiguredo_nvcodec) needs the clang builtin include
          # path so it can find stddef.h and other compiler-provided headers.
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/lib/llvm-18/lib/clang/18/include"
        run: |
          cargo test --locked -p streamkit-nodes --features gpu
          cargo test --locked -p streamkit-nodes --features nvcodec
          cargo test --locked -p streamkit-nodes --features vaapi
          cargo test --locked -p streamkit-engine --features gpu

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - name: Restore sccache cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            sccache-skit-build-${{ runner.os }}-

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: skit
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Build all crates
        run: |
          cargo build --locked --workspace --release
          cargo build --locked -p streamkit-server --bin skit --release --features "moq"
          cargo build --locked -p streamkit-client --bin skit-cli --release

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
