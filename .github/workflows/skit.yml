name: Skit CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p streamkit-server --all-targets --features "moq" -- -D warnings

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - name: Run tests (GPU tests run separately on self-hosted runner)
        run: |
          cargo test --locked --workspace -- --skip gpu_tests::
          cargo test --locked -p streamkit-server --features "moq"

  test-gpu:
    name: Test (GPU)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm cmake pkg-config libopus-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - name: Run GPU tests
        env:
          # The self-hosted runner runs Ubuntu 24.04 which ships libvpx 1.14.0,
          # but env-libvpx-sys 5.1.3 only has pre-generated FFI bindings up to
          # 1.13.0.  Setting VPX_LIB_DIR bypasses pkg-config version detection
          # and VPX_VERSION selects the 1.13.0 bindings (backward-compatible).
          VPX_LIB_DIR: /usr/lib/x86_64-linux-gnu
          VPX_INCLUDE_DIR: /usr/include
          VPX_VERSION: "1.13.0"
        run: |
          cargo test --locked -p streamkit-nodes --features gpu
          cargo test --locked -p streamkit-engine --features gpu
          cargo test --locked -p streamkit-nodes --features nvcodec

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install system dependencies (libvpx for VP9, nasm for AV1 assembly)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2

      - name: Build all crates
        run: |
          cargo build --locked --workspace --release
          cargo build --locked -p streamkit-server --bin skit --release --features "moq"
          cargo build --locked -p streamkit-client --bin skit-cli --release
