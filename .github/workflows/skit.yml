name: Skit CI

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-skit
        with:
          rust-cache-key: skit-lint
          rust-cache-shared-key: skit
          rust-components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: |
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo clippy --locked -p streamkit-server --all-targets --features "moq" -- -D warnings
          cargo clippy --locked -p streamkit-server --all-targets --features "mcp" -- -D warnings

      - name: Install cargo-deny
        run: cargo install --locked cargo-deny

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories
        run: cargo deny check advisories

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  test:
    name: Test
    runs-on: ubuntu-22.04
    env:
      # Three sequential debug test builds (default, moq, mcp) of an ever-growing
      # workspace overflow the hosted runner's disk during the mcp link step, even
      # after free-disk-aggressive. Disk-freeing is maxed out, so the only durable
      # lever left is artifact size: dropping debuginfo roughly halves target/.
      # Panic/assert locations survive via #[track_caller]; only deep backtrace
      # frames lose source lines, recoverable in a local full-debug build.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-skit
        with:
          rust-cache-key: skit-test
          rust-cache-shared-key: skit
          # Three sequential test builds (default, moq, mcp) sit right at the
          # hosted runner's disk limit; reclaim everything we can up front.
          free-disk-aggressive: "true"

      - name: Run tests (GPU tests run separately on self-hosted runner)
        run: |
          cargo test --locked --workspace -- --skip gpu_tests::
          cargo test --locked -p streamkit-server --features "moq"
          cargo test --locked -p streamkit-server --features "mcp"

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    # Threshold violations are caught by the all-checks gate (ci.yml
    # "Verify Codecov thresholds"); keep this job non-blocking so a
    # flaky coverage toolchain doesn't independently gate merges.
    continue-on-error: true
    env:
      # Isolate from the lint/test shared rust-cache; instrumented builds
      # would otherwise poison that cache for non-coverage jobs.
      CARGO_LLVM_COV_TARGET_DIR: target/coverage
      # Coverage instrumentation produces per-PR object files that don't
      # cache usefully across runs; bypass the workflow-level sccache to
      # avoid the "sccache not installed" failure and unnecessary indirection.
      RUSTC_WRAPPER: ""
      # Instrumented builds with full DWARF debuginfo exceed the hosted
      # runner's disk ("No space left on device" during the mcp link step).
      # llvm-cov reads its own coverage-mapping sections, not DWARF, so line
      # tables are enough to keep backtraces useful at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-skit
        with:
          rust-cache-key: skit-coverage
          rust-cache-workspaces: ". -> target/coverage"
          rust-components: llvm-tools-preview
          skip-sccache: "true"
          free-disk-aggressive: "true"

      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Collect coverage
        run: |
          cargo llvm-cov clean --workspace
          # `moq` is in streamkit-server's default features, so the
          # --workspace run already covers it. `mcp` is not in default,
          # hence the extra pass.
          cargo llvm-cov --workspace --no-report nextest -- --skip gpu_tests::
          cargo llvm-cov --no-report nextest -p streamkit-server --features "mcp"
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info

      - name: Upload lcov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-lcov
          path: target/coverage/lcov.info
          if-no-files-found: warn

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: target/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-gpu:
    name: Test (GPU)
    # Skip for fork PRs — self-hosted runners must not execute untrusted code.
    # NOTE: we check `github.event.pull_request == null` instead of
    # `github.event_name != 'pull_request'` because this workflow is invoked
    # via `workflow_call`, which sets event_name to "workflow_call" regardless
    # of the original trigger, making the event_name check always true.
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-skit
        with:
          rust-cache-key: skit-gpu
          skip-ui-build: "true"
          runs-on-self-hosted: "true"
          rust-cache-save-if: "true"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvpx-dev nasm cmake pkg-config libopus-dev libva-dev libgbm-dev

      - name: Run GPU tests
        env:
          # Ubuntu's nvidia-cuda-toolkit installs headers to /usr/include, not
          # /usr/local/cuda/include.  Tell shiguredo_nvcodec where to find them.
          CUDA_INCLUDE_PATH: /usr/include
          # bindgen (used by shiguredo_nvcodec) needs the clang builtin include
          # path so it can find stddef.h and other compiler-provided headers.
          BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/lib/llvm-18/lib/clang/18/include"
        run: |
          cargo test --locked -p streamkit-nodes --features gpu
          cargo test --locked -p streamkit-nodes --features nvcodec
          cargo test --locked -p streamkit-nodes --features vaapi
          cargo test --locked -p streamkit-engine --features gpu

  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-skit
        with:
          rust-cache-key: skit-build
          rust-cache-shared-key: skit

      - name: Build all crates
        run: |
          cargo build --locked --workspace --release
          cargo build --locked -p streamkit-server --bin skit --release --features "moq"
          cargo build --locked -p streamkit-client --bin skit-cli --release

      - name: Save sccache cache
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/sccache
          key: sccache-skit-build-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
