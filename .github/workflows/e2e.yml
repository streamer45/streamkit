name: E2E Tests

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Build UI
        working-directory: ./ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (libvpx for VP9 video support)
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev

      - name: Build skit (debug)
        run: cargo build -p streamkit-server --bin skit

      - name: Install E2E dependencies
        working-directory: ./e2e
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: ./e2e
        run: bunx playwright install chromium --with-deps

      - name: Lint E2E (typecheck + prettier)
        working-directory: ./e2e
        run: bun run lint

      - name: Run E2E tests
        working-directory: ./e2e
        run: bun run test

      - name: Run E2E tests (auth enabled)
        working-directory: ./e2e
        run: E2E_AUTH=1 bun run test

      - name: Run E2E perf tests (dev server)
        run: |
          # Start skit backend on default port for Vite proxy
          SK_SERVER__ADDRESS=127.0.0.1:4545 \
          SK_SERVER__MOQ_GATEWAY_URL=http://127.0.0.1:4545/moq \
          SK_LOG__FILE_ENABLE=false \
          RUST_LOG=warn \
          ./target/debug/skit serve &
          SKIT_PID=$!

          # Start Vite dev server in the background
          cd ui && bunx --bun vite &
          VITE_PID=$!
          cd ..

          # Wait for skit to become healthy
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4545/healthz > /dev/null 2>&1; then
              echo "skit is healthy"
              break
            fi
            sleep 1
          done

          # Wait for Vite dev server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3045/ > /dev/null 2>&1; then
              echo "Vite dev server is ready"
              break
            fi
            sleep 1
          done

          # Run perf tests against the dev server
          cd e2e
          E2E_BASE_URL=http://localhost:3045 bunx playwright test \
            tests/compositor-perf.spec.ts \
            tests/monitor-session-load-perf.spec.ts
          EXIT_CODE=$?

          # Cleanup background processes
          kill $SKIT_PID $VITE_PID 2>/dev/null || true
          exit $EXIT_CODE

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: e2e/test-results/
          retention-days: 7
