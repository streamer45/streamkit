name: UI CI

on:
  workflow_call:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Test and Coverage are deliberately separate so a v8-provider
      # regression in the instrumented run can't taint the plain
      # pass/fail signal. Issue #435 tracks collapsing them once
      # Coverage is promoted out of continue-on-error.
      - name: Test
        run: bun run test:run

      - name: Coverage
        # Informational during initial rollout — see codecov.yml.
        continue-on-error: true
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ui/coverage/lcov.info
          flags: ui
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: bun run build

      - name: Knip (unused code)
        run: bun run knip
