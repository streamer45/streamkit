name: UI CI

on:
  workflow_call:

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ./ui
    steps:
      # Full history so react-doctor can resolve the merge-base with origin/main
      # for its diff-gated scan.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # Cache bun's global package cache rather than node_modules: bun's
      # incremental install over a restored node_modules can miss nested
      # transitive deps, and a failed run poisons the cache for the same
      # lockfile key. A fresh install from the global cache is just as fast
      # and always consistent with the lockfile.
      - name: Cache bun package cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-pkg-cache-${{ hashFiles('ui/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-pkg-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # Diff-gated: only files changed vs origin/main are scanned, and only
      # error-severity findings block. Manual-memoization warnings are
      # disabled in doctor.config.json (deliberate React.memo barriers),
      # and dead-code analysis is skipped since knip covers it.
      - name: React Doctor (changed files)
        run: bun run doctor

      # Test and Coverage are deliberately separate so a v8-provider
      # regression in the instrumented run can't taint the plain
      # pass/fail signal. Issue #435 tracks collapsing them once
      # Coverage is promoted out of continue-on-error.
      - name: Test
        run: bun run test:run

      - name: Coverage
        # Threshold violations are caught by the all-checks gate — see
        # ci.yml "Verify Codecov thresholds" and codecov.yml.
        continue-on-error: true
        run: bun run test:coverage

      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          files: ui/coverage/lcov.info
          flags: ui
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: bun run build

      - name: Knip (unused code)
        run: bun run knip
