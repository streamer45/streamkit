[package]
name = "streamkit-server"
authors = ["Claudio Costa <cstcld91@gmail.com>", "StreamKit Contributors"]
repository = "https://github.com/streamer45/streamkit"
license = "MPL-2.0"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
name = "streamkit_server"
path = "src/lib.rs"

[[bin]]
name = "skit"
path = "src/main.rs"

[dependencies]
# Skit's core library
streamkit-core = { workspace = true }
streamkit-nodes = { workspace = true }
streamkit-engine = { workspace = true }
streamkit-api = { workspace = true }
streamkit-plugin-wasm = { workspace = true }
streamkit-plugin-native = { workspace = true }

# For building the command-line interface
clap = { version = "4.6", features = ["derive"] }

# For layered configuration management
figment = { version = "0.10.19", features = ["toml", "env"] }

# For serialization and deserialization
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }
serde_json = "1.0"
schemars = "1.2.0"
base64 = "0.22"
semver = "1.0"

# For serializing the default config into TOML format
toml = "1.1"

# For structured logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
anyhow = "1.0"

# For HTTP server
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
tokio-stream = "0.1.18"
hyper = { version = "1.9", features = ["full"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", features = ["ring"] }
reqwest = { version = "0.13", features = ["multipart", "json"] }
bytes = { workspace = true }
futures = { workspace = true }
uuid = { version = "1.23", features = ["v4", "serde"] }
http-body-util = "0.1"
multer = "3.1"
tar = "0.4"
zstd = "0.13"
flate2 = "1.1"
bzip2 = "0.6"

# For embedding static files
rust-embed = "8.11"
mime_guess = "2.0"

# For OpenTelemetry OTLP integration
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = [
  "rt-tokio",
  "metrics",
  "trace",
] }
opentelemetry-otlp = { version = "0.31.0", features = [
  "http-proto",
  "metrics",
  "trace",
  "grpc-tonic",
] }
opentelemetry-http = "0.31.0"
tracing-opentelemetry = "0.32.1"

# For system metrics collection
sysinfo = "0.39"

# For tokio-console debugging (optional)
console-subscriber = { version = "0.5", optional = true }
time = { version = "0.3.45", features = ["formatting"] }

# For CPU profiling (optional)
# Uses frame-pointer unwinding for much faster stack traces (vs libunwind)
# Requires building with frame pointers enabled: RUSTFLAGS="-C force-frame-pointers=yes"
pprof = { version = "0.15", features = [
  "flamegraph",
  "prost-codec",
  "frame-pointer",
], optional = true }

# For heap profiling (optional)
tikv-jemallocator = { version = "0.6", features = [
  "profiling",
  "unprefixed_malloc_on_supported_platforms",
], optional = true }
jemalloc_pprof = { version = "0.8", features = ["symbolize"], optional = true }

# For allocation rate profiling (optional, mutually exclusive with profiling feature)
dhat = { version = "0.3", optional = true }

# MoQ support (optional)
moq-native = { version = "0.13.13", optional = true }
async-trait = { workspace = true }

# For glob pattern matching in permissions
glob = "0.3"

# For image asset validation (decode + dimension extraction on upload)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# For built-in authentication
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["aws_lc_rs"] }
sha2 = "0.11"
hex = "0.4"
thiserror = "2.0"
getrandom = "0.4"
aws-lc-rs = "1"

# For MoQ auth path matching (optional, with moq feature)
moq-lite = { version = "0.15.15", optional = true }
blake2 = "0.10.6"
async-stream = "0.3.6"

# MCP (Model Context Protocol) server (optional)
rmcp = { version = "1.5", features = [
  "server",                                     # ServerHandler trait + service runner
  "transport-streamable-http-server",            # Streamable HTTP transport (tower service)
  "transport-streamable-http-server-session",    # Stateful session management (LocalSessionManager)
  "transport-io",                                # STDIO transport (stdin/stdout)
  "macros",                                      # #[tool], #[tool_router] proc macros
  "schemars",                                    # JSON Schema generation for tool arguments
], optional = true }
# Used by the MCP module to extract HTTP request parts from rmcp's request context.
http = { version = "1", optional = true }
fs2 = "0.4.3"

[features]
default = ["script", "compositor", "gpu", "moq"]
tokio-console = ["console-subscriber"]
profiling = ["dep:pprof", "dep:tikv-jemallocator", "dep:jemalloc_pprof"]
# DHAT allocation profiling - tracks allocation counts/rates (mutually exclusive with profiling)
# Use this to find hot allocation sites. Output is written on graceful shutdown.
dhat-heap = ["dep:dhat"]
moq = ["dep:moq-native", "dep:moq-lite"]
mcp = ["dep:rmcp", "dep:http"]
script = ["streamkit-nodes/script", "streamkit-engine/script"]
compositor = ["streamkit-nodes/compositor", "streamkit-engine/compositor"]
gpu = ["compositor", "streamkit-nodes/gpu", "streamkit-engine/gpu"]
svt_av1 = ["streamkit-nodes/svt_av1"]
svt_av1_static = ["streamkit-nodes/svt_av1_static"]
dav1d = ["streamkit-nodes/dav1d"]
dav1d_static = ["streamkit-nodes/dav1d_static"]
vulkan_video = ["streamkit-nodes/vulkan_video"]
vaapi = ["streamkit-nodes/vaapi"]
nvcodec = ["streamkit-nodes/nvcodec"]

[dev-dependencies]
tokio-test = "0.4.5"
tokio-tungstenite = "0.29"
futures-util = "0.3"
ogg = "0.9.2"
opus = "0.3.1"
tempfile = "3.27"
urlencoding = "2.1"
# Enables `figment::Jail` (sandboxed env/cwd) for config integration tests.
figment = { version = "0.10.19", features = ["test"] }

[lints.rust]
# Server needs unsafe code for jemalloc profiling configuration (export_name attribute)
# So we override the workspace forbid with warn
unsafe_code = "warn"

[lints.clippy]
# Categories
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Safety
unwrap_used = "warn"
expect_used = "warn"
# Complexity
cognitive_complexity = "warn"
# Math
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# Allow-list (Noise reduction)
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
