# Expectations manifest for the official oneshot sample pipelines
# (`samples/pipelines/oneshot/*.yml`), consumed by the `oneshot` test harness
# (tests/pipeline-validation/tests/oneshot.rs).
#
# Each table key is a sample's file stem. Fields:
#   output_extension  output suffix (e.g. ".webm"); also the ffprobe temp suffix
#   output_kind       "media" (default, validated with ffprobe) or "json"
#   container_format / codec_name / width / height / audio_codec / sample_rate /
#                     channels   media expectations (output_kind = media)
#   json_contains     substrings that must appear in the body (output_kind = json)
#   requires_node     node kind that must be registered, else skip
#   requires_nodes    additional node kinds that must be registered, else skip
#   optional_node     true => skip-not-fail even under PIPELINE_REQUIRE_NODES=1
#                     (nodes no CI job compiles: marketplace plugins, VA-API)
#   requires_env      env vars that must be set, else skip (e.g. S3 creds)
#   slow              true => only runs with PIPELINE_INCLUDE_SLOW=1
#   inputs            multipart parts: { field, file = <repo-relative> | text = <literal> }
#
# Every oneshot YAML must have an entry here, or the harness fails so the new
# sample gets triaged.

# Tier A: pure software, fast enough for the default CI job.

[double_volume]
output_extension = ".ogg"
container_format = "ogg"
audio_codec = "opus"
inputs = [{ field = "media", file = "samples/audio/system/sample.ogg" }]

[dual_upload_mixing]
output_extension = ".webm"
container_format = "matroska,webm"
audio_codec = "opus"
inputs = [
    { field = "track_a", file = "samples/audio/system/sample.ogg" },
    { field = "track_b", file = "samples/audio/system/sample.ogg" },
]

[mp4_mux_audio]
output_extension = ".mp4"
container_format = "mov,mp4,m4a,3gp,3g2,mj2"
audio_codec = "opus"
inputs = [{ field = "media", file = "samples/audio/system/sample.ogg" }]

[video_colorbars]
output_extension = ".webm"
container_format = "matroska,webm"
codec_name = "vp9"
width = 1280
height = 720

[openh264-encode-test]
output_extension = ".mp4"
container_format = "mov,mp4,m4a,3gp,3g2,mj2"
codec_name = "h264"
width = 640
height = 480

[mp4_mux_video]
output_extension = ".mp4"
container_format = "mov,mp4,m4a,3gp,3g2,mj2"
codec_name = "av1"
width = 640
height = 480
requires_node = "video::svt_av1::encoder"

