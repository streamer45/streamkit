# Codecov configuration. The project and patch statuses below report
# red on threshold violations (a real signal for reviewers), but they
# do not block merges yet — the coverage jobs in .github/workflows/{skit,ui}.yml
# are still `continue-on-error: true` and the required `All Checks Passed`
# gate only watches GitHub Actions job results, not Codecov commit
# statuses. Removing the informational override here is step 1 of two;
# step 2 (wiring the Codecov statuses into the merge gate) is tracked
# in issue #487.
#
# Status-stringency ratchet (separate from the coverage-sprint phases
# tracked in agent_docs/coverage.md):
#   Stage 1:           informational: true,  threshold: 100% (silent)
#   Stage 2 (current): project flags surface red, threshold: 1%
#                        (any coverage drop >1% reports red)
#   Stage 3 (current): patch.default surfaces red, target: 80%
#                        (new / changed code below 80% reports red)
#   Stage 4 (future):  tighten component_management default_rules from
#                        informational to red-surfacing once `engine`,
#                        `nodes`, and `server` are consistently above
#                        80%.
#   Merge-gate wiring: separate change to either include Codecov
#                        statuses in branch protection or fail the
#                        coverage jobs on threshold violations —
#                        tracked in issue #487.
# Stage transitions are intentionally manual — edit this file and remove
# `informational: true` / tighten `threshold` / `target` as the baseline
# settles. The `backend` and `ui` flag totals on the Codecov dashboard are
# the headline numbers to watch when deciding when to advance.

codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  status:
    project:
      backend:
        flags:
          - backend
        target: auto
        threshold: 1%
      ui:
        flags:
          - ui
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 0%

# Flags are project-level rollups uploaded from CI (one per workflow).
# Their `paths` are intentionally broader than the named components below:
# anything under `apps/` or `crates/` not covered by a specific component
# still contributes to the `backend` flag total. Components are the
# granular signal; flags are the headline number.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: backend
      paths:
        - apps/
        - crates/
    - name: ui
      paths:
        - ui/src/

# Components below cover the core/engine/api/nodes/server hot paths plus
# the two plugin crates and the most-tested UI subtrees. Code under
# `apps/skit-cli/`, `sdks/`, and the plugin/native workspaces is excluded
# from coverage entirely (see the `ignore` block at the bottom) because
# those workspaces are either thin protocol wrappers, vendored, or not
# built in the standard CI matrix. Add new components here as new
# subsystems land — keep the list small to make the dashboard readable.
component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 100%
        informational: true
  individual_components:
    - component_id: core
      name: core
      paths:
        - crates/core/**
    - component_id: engine
      name: engine
      paths:
        - crates/engine/**
    - component_id: api
      name: api
      paths:
        - crates/api/**
    - component_id: nodes
      name: nodes
      paths:
        - crates/nodes/**
    - component_id: server
      name: server
      paths:
        - apps/skit/**
    - component_id: plugin-native
      name: plugin-native
      paths:
        - crates/plugin-native/**
    - component_id: plugin-wasm
      name: plugin-wasm
      paths:
        - crates/plugin-wasm/**
    - component_id: ui-services
      name: ui-services
      paths:
        - ui/src/services/**
        - ui/src/hooks/**
        - ui/src/stores/**
    - component_id: ui-components
      name: ui-components
      paths:
        - ui/src/components/**

comment:
  layout: "header, diff, flags, components, files"
  behavior: default
  # Now that the Codecov statuses report red on threshold violations,
  # the bot only needs to comment when coverage actually changed —
  # otherwise PRs with no covered files get noisy "no change" comments.
  require_changes: true

ignore:
  - "**/generated/**"
  - "**/benches/**"
  - "**/examples/**"
  - "tests/pipeline-validation/**"
  - "plugins/**"
  - "ui/src/types/generated/**"
  - "apps/skit-cli/**"
  - "sdks/**"
  - "docs/**"
  # Boilerplate / infrastructure that cannot be meaningfully unit-tested
  # without standing up real subsystems (jemalloc, tracing-subscriber,
  # OTel SDK, pprof, MoQ/QUIC, wgpu adapter). Excluded after Phase 4 to
  # keep the headline `backend` flag focused on testable hot paths.
  - "apps/skit/src/main.rs"
  - "apps/skit/src/logging.rs"
  - "apps/skit/src/telemetry.rs"
  - "apps/skit/src/profiling.rs"
  - "apps/skit/src/server/moq.rs"
  - "crates/nodes/src/video/compositor/gpu.rs"
