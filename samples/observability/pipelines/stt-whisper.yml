# Deliberate fork of samples/pipelines/oneshot/speech_to_text.yml (which is
# referenced by gen-docs-reference.rs, so it is not repurposed here). This copy
# targets the multilingual ggml-tiny-q5_1.bin that the -demo image actually
# ships (the canonical pipeline points at the English-only ggml-tiny.en model,
# which is absent from that image; see README / #553).
name: stt
description: Speech-to-Text (Whisper) for the observability sample
mode: oneshot
attributes:
  service: stt
steps:
  - kind: streamkit::http_input
  - kind: containers::ogg::demuxer
  - kind: audio::opus::decoder
  - kind: audio::resampler
    params:
      chunk_frames: 960
      output_frame_size: 960
      target_sample_rate: 16000
  - kind: plugin::native::whisper
    params:
      model_path: models/ggml-tiny-q5_1.bin
      language: en
      vad_model_path: models/silero_vad.onnx
      vad_threshold: 0.5
      min_silence_duration_ms: 700
      max_segment_duration_secs: 30.0
  - kind: core::json_serialize
    params:
      pretty: false
      newline_delimited: true
  - kind: streamkit::http_output
    params:
      content_type: application/json
