# Overlay that adds the optional speech gateway and drops a Prometheus scrape
# fragment into conf.d/ so the gateway's /metrics endpoint is scraped. Without
# this overlay the conf.d glob matches nothing, so the base stack never
# references the gateway and there is no perpetually-DOWN scrape target on
# Prometheus' Targets page.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gateway.yml up -d --build
#   ./generate-traffic.sh --gateway

services:
  prometheus:
    volumes:
      - ./prometheus-gateway-scrape.yml:/etc/prometheus/conf.d/gateway.yml:ro

  gateway:
    build:
      context: ../../examples/speech-gateway
    environment:
      GATEWAY_LISTEN: ":8080"
      SKIT_URL: http://skit:4545
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      skit:
        condition: service_healthy
