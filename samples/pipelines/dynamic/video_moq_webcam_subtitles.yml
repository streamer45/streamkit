# Live subtitle demo: webcam PiP over colorbars with real-time Whisper
# transcription rendered as a Slint subtitle overlay.
#
# Data flow (subtitles):
#   mic → opus_decoder → resampler → whisper → [best_effort] →
#   param_bridge → UpdateParams → slint subtitle → compositor layer
#
#   whisper → [best_effort] → telemetry_out (stream view)
#
# Requires:
#   - plugin::native::whisper loaded (with a model, e.g. tiny.en)
#   - plugin::native::slint loaded
#   - Silero VAD model: models/silero_vad.onnx
#   just build-plugin-native-whisper && just build-plugin-native-slint && just copy-plugins-native

name: Webcam PiP + Live Subtitles (MoQ)
description: >-
  Composites the user's webcam as picture-in-picture over colorbars with
  real-time Whisper transcription displayed as subtitles via a Slint overlay.
  Demonstrates the param_bridge node for cross-node control messaging.
mode: dynamic
client:
  gateway_path: /moq/video
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: camera
  watch:
    broadcast: output
    audio: true
    video: true

nodes:
  # --- Background ---

  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8

  # --- MoQ transport (publish + subscribe) ---

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      input_broadcasts:
        - input
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: opus_encoder
      in_1: vp9_encoder

  # --- Audio → STT path ---

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  resampler:
    kind: audio::resampler
    params:
      target_sample_rate: 16000
    needs: opus_decoder

  whisper:
    kind: plugin::native::whisper
    params:
      model_path: models/ggml-tiny.en-q5_1.bin
      language: en
      vad_model_path: models/silero_vad.onnx
      vad_threshold: 0.4
      min_silence_duration_ms: 600
      max_segment_duration_secs: 30.0
      emit_vad_events: true
      n_threads: 0
    needs: resampler

  # Surface STT results in the stream view telemetry timeline.
  stt_telemetry:
    kind: core::telemetry_out
    params:
      packet_types: ["Transcription"]
      max_events_per_sec: 20
    needs:
      node: whisper
      mode: best_effort

  # --- Subtitle rendering (Slint) ---

  subtitles:
    kind: plugin::native::slint
    params:
      width: 1280
      height: 120
      fps: 30
      slint_file: samples/slint/system/subtitle.slint
      properties:
        text: ""
        show: true

  subtitle_bridge:
    kind: core::param_bridge
    params:
      target_node: subtitles
      mode: template
      template:
        properties:
          text: "{{ text }}"
      debounce_ms: 100
    needs:
      in:
        node: whisper
        mode: best_effort

  # --- Video decode + compositing ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      in: moq_peer.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 3
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.9
          z_index: 1
          crop_zoom: 2.2
          crop_x: 0.5
          crop_y: 0.5
        in_2:
          rect:
            x: 0
            y: 600
            width: 1280
            height: 120
          opacity: 1.0
          z_index: 2
    needs:
      - colorbars_bg
      - vp9_decoder
      - subtitles

  # --- Encode + output ---

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio loopback ---

  opus_encoder:
    kind: audio::opus::encoder
    needs: opus_decoder
