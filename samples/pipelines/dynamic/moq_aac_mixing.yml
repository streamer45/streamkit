# Real-time mixing pipeline using AAC encoding, output to MP4 via MoQ peer.
#
# Topology:
#   MoQ peer (Opus input) → decode → mix with music → AAC encode → MP4 mux
#
# The mixer outputs 960 samples/channel (Opus frame size at 48 kHz);
# the AAC encoder's internal residual buffer accumulates samples until
# a full 1024-sample AAC-LC frame is available, so the frame-size
# mismatch is handled transparently.
#
# Requires: aac-encoder native plugin (just install-plugin aac-encoder)

name: Real-Time MoQ Mixing (AAC to MP4)
description: |
  Accepts Opus audio via MoQ, mixes with a local music track,
  encodes to AAC, and muxes into a streamable MP4.
mode: dynamic
nodes:
  # ============================================================
  # MOQ INPUT: Accept Opus audio from a WebTransport publisher
  # ============================================================
  moq_peer:
    kind: transport::moq::peer
    params:
      path: /moq/mixing-aac
      audio_only: true

  mic_opus_decoder:
    kind: audio::opus::decoder
    needs: moq_peer.audio/data

  mic_gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: mic_opus_decoder

  # ============================================================
  # MUSIC SOURCE: Read, demux, pace, decode, and apply gain
  # ============================================================
  music_file_reader:
    kind: core::file_reader
    params:
      chunk_size: 8192
      path: samples/audio/system/THE LADY IS A TRAMP.opus

  music_ogg_demuxer:
    kind: containers::ogg::demuxer
    needs: music_file_reader

  music_pacer:
    kind: core::pacer
    params:
      buffer_size: 16
      speed: 1
    needs: music_ogg_demuxer

  music_opus_decoder:
    kind: audio::opus::decoder
    needs: music_pacer

  music_gain:
    kind: audio::gain
    params:
      gain: 0.15
    needs: music_opus_decoder

  # ============================================================
  # MIX + ENCODE + MUX
  # ============================================================
  mixer:
    kind: audio::mixer
    params:
      samples_per_channel: 960
      generate_silence: true
    needs:
      - mic_gain
      - music_gain

  aac_encoder:
    kind: plugin::native::aac_encoder
    params:
      bitrate: 128000
    needs: mixer

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: stream
      audio_codec: aac
    needs: aac_encoder
