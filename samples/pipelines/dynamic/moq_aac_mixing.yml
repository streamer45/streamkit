# Real-time MoQ mixing pipeline using AAC encoding instead of Opus.
#
# NOTE: This pipeline is a placeholder — the AAC encoder native plugin
# currently outputs `PacketType::Binary` (via the BinaryWithMeta C ABI)
# rather than `PacketType::EncodedAudio(Aac)`.  MoQ transport nodes
# (moq_peer, moq_push) only accept `EncodedAudio`, so plugging the AAC
# encoder directly into MoQ is not yet possible.
#
# Once the native plugin C ABI gains an `EncodedAudio` discriminant (or
# the host adds automatic Binary→EncodedAudio promotion for known
# content-types), this pipeline can be enabled by wiring aac_encoder.out
# into a moq_push or moq_peer input.
#
# For now, use the oneshot AAC pipelines (aac_encode.yml,
# mp4_mux_aac_h264.yml) which route through the MP4 muxer — the muxer
# accepts Binary packets with content_type "audio/aac".
#
# Requires: aac-encoder native plugin (just install-plugin aac-encoder)

name: Real-Time MoQ Mixing (AAC) [placeholder]
description: |
  Mixes a local music track, encodes to AAC, and writes to MP4.
  MoQ output is blocked by the Binary vs EncodedAudio type gap
  (see note above).
mode: dynamic
nodes:
  # ============================================================
  # MUSIC SOURCE: Read, demux, pace, decode, and apply gain
  # ============================================================
  music_file_reader:
    kind: core::file_reader
    params:
      chunk_size: 8192
      path: samples/audio/system/THE LADY IS A TRAMP.opus

  music_ogg_demuxer:
    kind: containers::ogg::demuxer
    needs: music_file_reader

  music_pacer:
    kind: core::pacer
    params:
      buffer_size: 16
      speed: 1
    needs: music_ogg_demuxer

  music_opus_decoder:
    kind: audio::opus::decoder
    needs: music_pacer

  music_gain:
    kind: audio::gain
    params:
      gain: 0.8
    needs: music_opus_decoder

  # ============================================================
  # OUTPUT: Encode to AAC
  # The mixer outputs 960 samples/channel (Opus frame size);
  # the AAC encoder's residual buffer accumulates samples until
  # a full 1024-sample AAC frame is available.
  # ============================================================
  aac_encoder:
    kind: plugin::native::aac_encoder
    params:
      bitrate: 128000
    needs: music_gain
