name: Video Color Bars (MoQ Stream)
description: Continuously generates SMPTE color bars and streams via MoQ
mode: dynamic

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      pixel_format: nv12

  vp9_encoder:
    kind: video::vp9::encoder
    needs: colorbars

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs:
      video: vp9_encoder
