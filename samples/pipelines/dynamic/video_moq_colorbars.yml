name: Video Color Bars (MoQ Stream)
description: Continuously generates SMPTE color bars and streams via MoQ
group: video-colorbars-stream
variant: VP9 (Software)
canonical: true
category: Streaming
tags:
  - streaming
  - video-encoding
keywords:
  - colorbars
  - smpte
  - test pattern
  - vp9
mode: dynamic
client:
  gateway_path: /moq/video
  watch:
    broadcast: output
    audio: false
    video: true

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: nv12
      draw_time: true

  vp9_encoder:
    kind: video::vp9::encoder
    needs: colorbars

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: vp9_encoder
