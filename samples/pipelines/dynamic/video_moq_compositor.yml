name: Video Compositor (MoQ Stream)
description: Composites two colorbars sources through the compositor node and streams via MoQ
mode: dynamic

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30

  colorbars_pip:
    kind: video::colorbars
    params:
      width: 320
      height: 240
      fps: 30
      pixel_format: rgba8

  compositor:
    kind: video::compositor
    params:
      width: 640
      height: 480
      num_inputs: 2
      output_pixel_format: i420
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 100
            y: 220
            width: 240
            height: 180
          opacity: 0.9
          z_index: 1
          rotation_degrees: 15.0
    needs:
      - colorbars_bg
      - colorbars_pip

  vp9_encoder:
    kind: video::vp9::encoder
    needs: compositor

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs:
      video: vp9_encoder
