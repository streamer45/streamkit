name: Screen Share (MoQ Stream)
description: Captures the user's screen, composites it with a text overlay, encodes as VP9 at 1920×1080, loops microphone audio through a gain filter, and streams both via MoQ
mode: dynamic
client:
  gateway_path: /moq/screen
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: screen
  watch:
    broadcast: output
    audio: true
    video: true

nodes:
  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/screen
      input_broadcasts:
        - input
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: opus_encoder
      in_1: vp9_encoder

  # --- Video path: decode screen capture → composite with overlay → encode ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      # @moq/publish uses "video/hd" as the track name (not "video/data")
      in: moq_peer.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1920
      height: 1080
      num_inputs: 1
      layers:
        in:
          rect:
            x: 0
            y: 0
            width: 1920
            height: 1080
          opacity: 1
          rotation_degrees: 0
          z_index: 0
          mirror_horizontal: false
          mirror_vertical: false
          crop_zoom: 1
          crop_x: 0.5
          crop_y: 0.5
      text_overlays:
        - id: greeting
          text: Screen Share — StreamKit
          rect:
            x: 560
            y: 500
            width: 800
            height: 80
          color:
            - 255
            - 255
            - 255
            - 200
          font_size: 60
          font_name: samples/fonts/system/DejaVuSans-Bold.ttf
          bold: true
          opacity: 1
          rotation_degrees: 0
          z_index: 1
          mirror_horizontal: false
          mirror_vertical: false
      image_overlays:
        - id: logo
          asset_path: samples/images/system/streamkit-logo.png
          rect:
            x: 1844
            y: 20
            width: 56
            height: 96
          opacity: 0.7
          z_index: 2
    needs: vp9_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio path: decode → gain → encode ---

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain
