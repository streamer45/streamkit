# Live subtitle demo with GPU-accelerated Vulkan Video H.264 encoding.
#
# Composites the user's webcam as PiP over colorbars with a StreamKit
# logo overlay, greeting text, and real-time Parakeet transcription
# rendered as a Slint subtitle overlay.  Audio is looped back through
# a tuneable gain filter.
#
# Data flow (subtitles):
#   mic → opus_decoder → resampler → parakeet → [best_effort] →
#   subtitle_bridge → UpdateParams(text) → slint subtitle → compositor
#
# Data flow (speaking indicator):
#   resampler → vad → [best_effort] →
#   vad_bridge → UpdateParams(speaking) → slint subtitle
#
# Data flow (video):
#   webcam → moq_peer → vp9_decoder → compositor → vk_h264_encoder → moq_peer
#
# Data flow (audio loopback):
#   moq_peer → opus_decoder → gain → opus_encoder → moq_peer
#
# Key features:
#   - Vulkan Video H.264 GPU-accelerated encoding for the output stream
#   - Two param_bridge nodes coordinating on a single Slint overlay
#     (subtitle text + VAD speaking indicator)
#   - Interactive UI controls (volume, subtitle visibility)
#   - StreamKit logo image overlay + greeting text overlay
#
# Requires:
#   - skit built with --features vulkan_video
#   - Vulkan-capable GPU with H.264 encode support
#   - plugin::native::parakeet loaded (with Parakeet TDT model)
#   - plugin::native::vad loaded (with TEN-VAD model)
#   - plugin::native::slint loaded
#   just build-plugin-native-parakeet && just build-plugin-native-vad && just build-plugin-native-slint && just copy-plugins-native
#   just download-parakeet-models && just download-silero-vad && just download-tenvad-models

name: Webcam PiP + Live Subtitles (Vulkan Video H.264)
description: >-
  GPU-accelerated webcam compositing with real-time speech transcription.
  Composites the user's webcam as picture-in-picture over colorbars with
  a StreamKit logo overlay and live Parakeet TDT subtitles via Slint.
  Uses Vulkan Video H.264 for hardware-accelerated encoding.
  Demonstrates two param_bridge nodes coordinating subtitle text and
  speaking indicator on a single Slint overlay target.
mode: dynamic
client:
  gateway_path: /moq/video
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: camera
  watch:
    broadcast: output
    audio: true
    video: true
  controls:
    - label: "Show Subtitles"
      type: toggle
      node: subtitles
      property: properties.show
      default: true
    - label: "Volume"
      type: number
      node: gain
      property: gain
      default: 1.0
      min: 0.0
      max: 4.0
      step: 0.1

nodes:
  # --- Background ---

  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8

  # --- MoQ transport (publish + subscribe) ---

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      input_broadcasts:
        - input
      output_broadcast: output
      allow_reconnect: true
      video_codec: h264
    needs:
      in: opus_encoder
      in_1: vk_h264_encoder

  # --- Audio → STT path ---

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  resampler:
    kind: audio::resampler
    params:
      target_sample_rate: 16000
    needs: opus_decoder

  parakeet:
    kind: plugin::native::parakeet
    params:
      model_dir: models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
      num_threads: 4
      use_vad: true
      vad_model_path: models/silero_vad.onnx
      vad_threshold: 0.5
      min_silence_duration_ms: 700
    needs: resampler

  # --- Real-time VAD → speaking indicator ---

  vad:
    kind: plugin::native::vad
    params:
      output_mode: events
      threshold: 0.5
      min_silence_duration_s: 0.3
      min_speech_duration_s: 0.15
    needs: resampler

  vad_bridge:
    kind: core::param_bridge
    params:
      target_node: subtitles
      mode: template
      template:
        properties:
          speaking: "{{ is_speech }}"
    needs:
      in:
        node: vad
        mode: best_effort

  # --- Subtitle rendering (Slint) ---

  subtitles:
    kind: plugin::native::slint
    params:
      width: 1280
      height: 120
      fps: 30
      slint_file: samples/slint/system/subtitle.slint
      properties:
        text: ""
        show: true
        speaking: false

  subtitle_bridge:
    kind: core::param_bridge
    params:
      target_node: subtitles
      mode: template
      template:
        properties:
          text: "{{ text }}"
      debounce_ms: 100
    needs:
      in:
        node: parakeet
        mode: best_effort

  # --- Video decode + compositing ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      in: moq_peer.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 3
      output_format: nv12
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.9
          z_index: 1
          crop_zoom: 2.2
          crop_x: 0.5
          crop_y: 0.5
        in_2:
          rect:
            x: 0
            y: 600
            width: 1280
            height: 120
          opacity: 1.0
          z_index: 2
      image_overlays:
        - id: logo
          asset_path: samples/images/system/streamkit-logo.png
          rect:
            x: 20
            y: 630
            width: 34
            height: 60
          opacity: 0.7
          z_index: 10
      text_overlays:
        - id: greeting
          text: "Voice-Reactive Demo"
          rect:
            x: 20
            y: 20
            width: 400
            height: 40
          color: [255, 255, 255, 180]
          font_size: 28
          font_name: samples/fonts/system/Inter.ttf
          opacity: 1.0
          z_index: 11
    needs:
      - colorbars_bg
      - vp9_decoder
      - subtitles

  # --- HW-accelerated H.264 encode ---

  vk_h264_encoder:
    kind: video::vulkan_video::h264_encoder
    params:
      bitrate: 3000000
      framerate: 30
    needs: compositor

  # --- Audio loopback with gain control ---

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain
