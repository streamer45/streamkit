name: Video Compositor (MSE Output)
description: >
  Composites two colorbars sources and streams via HTTP/MSE only.
  No MoQ output — validates MSE endpoint in isolation.
  Access the stream at GET /mse/{session_id}/video
mode: dynamic
client:
  watch:
    mse_path: /video
    video: true

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  colorbars_pip:
    kind: video::colorbars
    params:
      width: 320
      height: 240
      fps: 30
      pixel_format: rgba8
      draw_time: true

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 100
            y: 220
            width: 240
            height: 180
          opacity: 0.9
          z_index: 1
    needs:
      - colorbars_bg
      - colorbars_pip

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      streaming_mode: live
    needs: vp9_encoder

  http_mse:
    kind: transport::http::mse
    params:
      path: /video
      max_clients: 10
      content_type: 'video/webm; codecs="vp9"'
    needs: webm_muxer
