# Composites a Servo-rendered web page as a picture-in-picture overlay on
# top of SMPTE colorbars and streams the result live via MoQ.
#
# Demonstrates:
#   - Servo plugin as a real-time video source in a dynamic pipeline
#   - Web page rendered as a PiP layer with transparency
#   - Runtime URL updates via the controls panel
#
# Requires: plugin::native::servo loaded
#   just build-plugin-native-servo && just install-plugin servo
#
# Start the server:
#   SK_SERVER__MOQ_GATEWAY_URL=http://127.0.0.1:4545/moq \
#     SK_SERVER__ADDRESS=127.0.0.1:4545 just skit
#
# View at: http://localhost:3045/stream (with `just ui` running)

name: Video Web Overlay (Servo + MoQ)
description: Composites a Servo-rendered web page as PiP overlay on colorbars and streams via MoQ
mode: dynamic
client:
  gateway_path: /moq/video
  watch:
    broadcast: output
    audio: false
    video: true
  controls:
    - label: "URL"
      type: text
      node: web_overlay
      property: url
      default: "https://streamkit.dev"
    - label: "Custom CSS"
      type: text
      node: web_overlay
      property: custom_css
      default: ""

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  web_overlay:
    kind: plugin::native::servo
    params:
      url: "https://streamkit.dev"
      width: 640
      height: 480
      fps: 30

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 600
            y: 200
            width: 640
            height: 480
          opacity: 0.95
          z_index: 1
      text_overlays:
        - id: "overlay_label"
          text: "Web Overlay (Servo)"
          rect:
            x: 600
            y: 175
            width: 640
            height: 24
          color: [255, 255, 255, 200]
          font_size: 18
          opacity: 1.0
          z_index: 2
          font_name: samples/fonts/system/DejaVuSans.ttf
    needs:
      - colorbars_bg
      - web_overlay

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: vp9_encoder
