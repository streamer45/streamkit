# Composites a Servo-rendered web page as a picture-in-picture overlay on
# top of SMPTE colorbars and streams the result live via MoQ.
#
# Demonstrates:
#   - Servo plugin as a real-time video source in a dynamic pipeline
#   - Web page rendered as a PiP layer with transparency
#   - Runtime URL updates via the controls panel
#   - Viewport emulation (1280x960 viewport → 640x480 output) to
#     show full page layouts without cropping
#
# Requires: plugin::native::servo loaded
#   just build-plugin-native-servo && just install-plugin servo
#
# Start the server:
#   SK_SERVER__MOQ_GATEWAY_URL=http://127.0.0.1:4545/moq \
#     SK_SERVER__ADDRESS=127.0.0.1:4545 just skit
#
# View at: http://localhost:3045/stream (with `just ui` running)

name: Video Web Overlay (Servo + MoQ)
description: Composites a Servo-rendered web page as PiP overlay on colorbars and streams via MoQ
category: Streaming
tags:
  - streaming
  - compositing
  - web-capture
  - video-encoding
keywords:
  - servo
  - web
  - browser
  - overlay
  - pip
mode: dynamic
client:
  gateway_path: /moq/video
  watch:
    broadcast: output
    audio: false
    video: true
  controls:
    - label: "Page"
      type: select
      node: web_overlay
      property: url
      default: "https://streamkit.dev"
      options:
        - label: StreamKit — Home
          value: "https://streamkit.dev"
        - label: Servo — Home
          value: "https://servo.org"
        - label: MoQ — Home
          value: "https://moq.dev"
        - label: MDN — CSS Grid
          value: "https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_grid_layout"
        - label: "WebGL Aquarium"
          value: "https://webglsamples.org/aquarium/aquarium.html"
    - label: "Viewport"
      type: select
      node: web_overlay
      property: viewport_resolution
      default: "1280x960"
      options:
        - label: "480p (640×480)"
          value: "640x480"
        - label: "720p (1280×720)"
          value: "1280x720"
        - label: "960p (1280×960)"
          value: "1280x960"
        - label: "1080p (1920×1080)"
          value: "1920x1080"
        - label: "1440p (2560×1440)"
          value: "2560x1440"

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  web_overlay:
    kind: plugin::native::servo
    params:
      url: "https://streamkit.dev"
      width: 640
      height: 480
      viewport_width: 1280
      viewport_height: 960
      fps: 30

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 600
            y: 200
            width: 640
            height: 480
          opacity: 0.95
          z_index: 1
      text_overlays:
        - id: "overlay_label"
          text: "Web Overlay (Servo)"
          rect:
            x: 600
            y: 175
            width: 640
            height: 24
          color: [255, 255, 255, 200]
          font_size: 18
          opacity: 1.0
          z_index: 2
          font_name: samples/fonts/system/DejaVuSans.ttf
    needs:
      - colorbars_bg
      - web_overlay

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: vp9_encoder
