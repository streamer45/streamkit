# Receives webcam (AV1) and microphone via MoQ, composites webcam as PiP
# over colorbars with a text overlay and logo watermark, re-encodes video
# as AV1 via SVT-AV1 at 1280x720, muxes audio + video into WebM, and
# outputs via HTTP/MSE only.
# Access the stream at GET /mse/{session_id}/video
#
# Requires: skit built with --features svt_av1

name: Webcam PiP – SVT-AV1 (MSE Output)
description: >
  Receives webcam (AV1) and microphone via MoQ, composites webcam as PiP over
  colorbars with a text overlay and logo watermark, re-encodes as AV1 (SVT-AV1)
  at 1280x720, muxes into WebM, and outputs via HTTP/MSE.
  Access the stream at GET /mse/{session_id}/video
mode: dynamic
client:
  gateway_path: /moq/video-mse-av1-pip
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: camera
        codec: av1
  watch:
    mse_path: /video
    audio: true
    video: true

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video-mse-av1-pip
      input_broadcasts:
        - input
      allow_reconnect: true
      video_codec: av1

  # --- Video path: decode webcam (AV1 from browser) → composite over colorbars → encode as AV1 ---

  av1_decoder:
    kind: video::av1::decoder
    needs:
      # @moq/publish uses "video/hd" as the track name
      in: moq_peer.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          rect:
            x: 0
            y: 0
            width: 1280
            height: 720
          opacity: 1
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.8
          z_index: 1
          crop_zoom: 2.2
          crop_x: 0.5
          crop_y: 0.5
      text_overlays:
        - id: greeting
          text: Hello from StreamKit (SVT-AV1)
          rect:
            x: 314
            y: 330
            width: 654
            height: 50
          color:
            - 255
            - 255
            - 255
            - 220
          font_size: 36
          font_name: samples/fonts/system/DejaVuSans-Bold.ttf
          opacity: 1
          z_index: 2
      image_overlays:
        - id: logo
          asset_path: samples/images/system/streamkit-logo.png
          rect:
            x: 1220
            y: 640
            width: 30
            height: 52
          opacity: 0.7
          z_index: 3
    needs:
      - colorbars_bg
      - av1_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  svt_av1_encoder:
    kind: video::svt_av1::encoder
    params:
      preset: 12
      crf: 35
      low_latency: true
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio path: decode → gain → encode ---

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain

  # --- Mux audio + video into WebM → serve via MSE ---

  webm_muxer:
    kind: containers::webm::muxer
    params:
      streaming_mode: live
      num_inputs: 2
      video_width: 1280
      video_height: 720
    needs:
      in: opus_encoder
      in_1: svt_av1_encoder

  http_mse:
    kind: transport::http::mse
    params:
      path: /video
      max_clients: 10
    needs: webm_muxer
