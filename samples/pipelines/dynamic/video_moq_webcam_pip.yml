name: Webcam PiP (MoQ Stream)
description: Composites the user's webcam as picture-in-picture over colorbars with a text overlay, loops audio through a gain filter, and streams both via MoQ
mode: dynamic

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      input_broadcast: input
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: opus_encoder
      in_1: vp9_encoder

  # --- Video path: decode webcam → composite over colorbars → encode ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      in: moq_peer.out_1

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.95
          z_index: 1
      text_overlays:
        - id: "greeting"
          text: "Hello from StreamKit"
          rect:
            x: 40
            y: 660
            width: 400
            height: 40
          opacity: 1.0
          z_index: 2
          color: [255, 255, 255, 220]
          font_size: 28
          font_name: dejavu-sans-bold
    needs:
      - colorbars_bg
      - vp9_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio path: decode → gain → encode ---

  opus_decoder:
    kind: audio::opus::decoder
    needs: moq_peer

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain
