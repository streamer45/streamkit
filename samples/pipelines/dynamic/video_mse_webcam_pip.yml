name: Webcam PiP (MSE Output)
description: >
  Receives webcam and microphone via MoQ, composites webcam as PiP over
  colorbars, muxes audio + video into WebM, and outputs via HTTP/MSE only.
  Access the stream at GET /mse/{session_id}/video
mode: dynamic
client:
  gateway_path: /moq/video-mse-pip
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: camera

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video-mse-pip
      input_broadcasts:
        - input
      allow_reconnect: true

  # --- Video path: decode webcam → composite over colorbars → encode ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      # @moq/publish uses "video/hd" as the track name
      in: moq_peer.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          rect:
            x: 0
            y: 0
            width: 1280
            height: 720
          opacity: 1
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.8
          z_index: 1
          crop_zoom: 2.2
          crop_x: 0.5
          crop_y: 0.5
    needs:
      - colorbars_bg
      - vp9_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio path: decode → gain → encode ---

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain

  # --- Mux audio + video into WebM → serve via MSE ---

  webm_muxer:
    kind: containers::webm::muxer
    params:
      streaming_mode: live
    needs:
      in: opus_encoder
      in_1: vp9_encoder

  http_mse:
    kind: transport::http::mse
    params:
      path: /video
      max_clients: 10
      content_type: 'video/webm; codecs="vp9,opus"'
    needs: webm_muxer
