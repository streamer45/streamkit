name: MoQ Relay Echo (Audio)
description: Subscribes to an audio broadcast on a MoQ relay, applies unity gain, and republishes — validates the full relay pub/sub path
category: Streaming
tags:
  - streaming
  - relay
keywords:
  - moq
  - relay
  - echo
  - pub/sub
mode: dynamic
client:
  relay_url: http://127.0.0.1:4443
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
  watch:
    broadcast: output
    audio: true
    video: false
nodes:
  moq_input:
    kind: transport::moq::subscriber
    params:
      url: http://127.0.0.1:4443
      broadcast: input
  opus_decoder:
    kind: audio::opus::decoder
    needs: moq_input
  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder
  opus_encoder:
    kind: audio::opus::encoder
    needs: gain
  moq_output:
    kind: transport::moq::publisher
    params:
      url: http://127.0.0.1:4443
      broadcast: output
      channels: 1
      group_duration_ms: 40
      initial_delay_ms: 250
      audio: true
    needs: opus_encoder
