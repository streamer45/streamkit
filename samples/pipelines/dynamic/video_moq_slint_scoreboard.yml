# Demonstrates Slint overlays (scoreboard + lower third) composited onto
# colorbars and streamed via MoQ, with runtime property updates.
#
# Each Slint overlay is a standalone plugin::native::slint source node whose output
# is wired into the compositor as a regular video layer.
#
# Requires: plugin::native::slint loaded
#   just build-plugin-native-slint && just copy-plugins-native
#
# After starting the pipeline, update properties at runtime:
#
#   curl -X POST http://localhost:4545/api/v1/sessions/<id>/nodes/scoreboard/update \
#     -H 'Content-Type: application/json' \
#     -d '{
#       "properties": {
#         "home_score": 4,
#         "clock_start": 2147,
#         "period": "2ND"
#       }
#     }'
#
# NOTE: Only `properties` are mergeable at runtime via UpdateParams.
# Init-time fields (slint_file, width, height, fps, frame_count,
# keyframe_interval, property_keyframes, static_ui) are ignored in
# UpdateParams because serde defaults make it impossible to distinguish
# "user sent empty" from "field was absent".

name: Video Slint Scoreboard + Lower Third (MoQ)
description: Composites colorbars with Slint scoreboard and lower-third overlays, streams via MoQ with runtime property updates
category: Streaming
tags:
  - streaming
  - compositing
  - video-encoding
keywords:
  - slint
  - scoreboard
  - lower third
  - overlay
  - graphics
mode: dynamic
client:
  gateway_path: /moq/video
  watch:
    broadcast: output
    audio: false
    video: true
  controls:
    - label: "Show Lower Third"
      type: toggle
      node: lower_third
      property: properties.show
      default: true
    - label: "Clock Running"
      type: toggle
      node: scoreboard
      property: properties.clock_running
      group: Scoreboard
      default: true
    - label: "Player Name"
      type: text
      node: lower_third
      property: properties.name
      default: "Alex Johnson"
    - label: "Subtitle"
      type: text
      node: lower_third
      property: properties.subtitle
      default: "Forward · #17"
    - label: "Home Score"
      type: number
      node: scoreboard
      property: properties.home_score
      group: Scoreboard
      default: 3
      min: 0
      max: 99
      step: 1
    - label: "Away Score"
      type: number
      node: scoreboard
      property: properties.away_score
      group: Scoreboard
      default: 1
      min: 0
      max: 99
      step: 1
    - label: "Period"
      type: text
      node: scoreboard
      property: properties.period
      group: Scoreboard
      default: "2ND"

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  scoreboard:
    kind: plugin::native::slint
    params:
      width: 420
      height: 80
      fps: 30
      slint_file: samples/slint/system/scoreboard.slint
      properties:
        home_team: "EAGLES"
        away_team: "HAWKS"
        home_score: 3
        away_score: 1
        clock_start: 754
        clock_running: true
        period: "2ND"

  lower_third:
    kind: plugin::native::slint
    params:
      width: 350
      height: 70
      fps: 30
      slint_file: samples/slint/system/lower_third.slint
      properties:
        name: "Alex Johnson"
        subtitle: "Forward · #17"
        show: true

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 3
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 430
            y: 20
            width: 420
            height: 80
          opacity: 1.0
          z_index: 10
        in_2:
          rect:
            x: 50
            y: 600
            width: 350
            height: 70
          opacity: 1.0
          z_index: 11
    needs:
      - colorbars_bg
      - scoreboard
      - lower_third

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
    needs: vp9_encoder
