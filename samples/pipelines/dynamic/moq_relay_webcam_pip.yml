name: MoQ Relay Webcam PiP (Audio + Video)
description: Subscribes audio+video from a MoQ relay, composites the webcam as PiP over colorbars, and republishes both tracks — validates multi-track relay pub/sub
# NOTE: The publisher must already be streaming to the 'input' broadcast before
# starting this pipeline, otherwise track discovery will miss the video/hd pin.
category: Streaming
tags:
  - streaming
  - relay
  - compositing
  - picture-in-picture
  - webcam
keywords:
  - moq
  - relay
  - webcam
  - camera
  - pip
mode: dynamic
client:
  relay_url: http://127.0.0.1:4443
  publish:
    broadcast: input
    tracks:
      - kind: audio
        source: microphone
      - kind: video
        source: camera
  watch:
    broadcast: output
    audio: true
    video: true

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      pixel_format: rgba8
      draw_time: true

  moq_input:
    kind: transport::moq::subscriber
    params:
      url: http://127.0.0.1:4443
      broadcast: input

  # --- Video path: decode webcam → composite over colorbars → encode ---

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      # @moq/publish uses "video/hd" as the track name (not "video/data")
      in: moq_input.video/hd

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          rect:
            x: 0
            y: 0
            width: 1280
            height: 720
          opacity: 1
          z_index: 0
        in_1:
          rect:
            x: 880
            y: 20
            width: 380
            height: 285
          opacity: 0.8
          z_index: 1
          crop_zoom: 2.2
          crop_x: 0.5
          crop_y: 0.5
    needs:
      - colorbars_bg
      - vp9_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  # --- Audio path: decode → gain → encode ---

  opus_decoder:
    kind: audio::opus::decoder
    needs: moq_input

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain

  moq_output:
    kind: transport::moq::publisher
    params:
      url: http://127.0.0.1:4443
      broadcast: output
      channels: 1
      group_duration_ms: 40
      initial_delay_ms: 250
      audio: true
      video: true
    needs:
      in: opus_encoder
      in_1: vp9_encoder
