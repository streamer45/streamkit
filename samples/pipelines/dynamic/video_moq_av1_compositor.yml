# NOTE: AV1 (rav1e speed=10) is single-thread-bound and can only sustain
# real-time 30 fps at 640x480 on current hardware.  1280x720 encodes at
# ~11 fps (88 ms/frame), well below real-time.  Use 640x480 for live
# pipelines until faster speed presets or hardware acceleration are available.

name: Video Compositor – AV1 (MoQ Stream)
description: Composites two colorbars sources with the StreamKit logo watermark, encodes as AV1 (rav1e) at 640x480, and streams via MoQ
mode: dynamic
client:
  gateway_path: /moq/video
  watch:
    broadcast: output
    audio: false
    video: true

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      pixel_format: rgba8
      draw_time: true

  colorbars_pip:
    kind: video::colorbars
    params:
      width: 240
      height: 180
      fps: 30
      pixel_format: rgba8
      draw_time: true

  compositor:
    kind: video::compositor
    params:
      width: 640
      height: 480
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 50
            y: 150
            width: 240
            height: 180
          opacity: 0.9
          z_index: 1
          rotation_degrees: 15.0
      image_overlays:
        - id: logo
          asset_path: samples/images/system/streamkit-logo.png
          rect:
            x: 590
            y: 395
            width: 23
            height: 40
          opacity: 0.7
          z_index: 3
    needs:
      - colorbars_bg
      - colorbars_pip

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  av1_encoder:
    kind: video::av1::encoder
    params:
      speed: 10
      low_latency: true
    needs: pixel_convert

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      output_broadcast: output
      allow_reconnect: true
      video_codec: av1
    needs: av1_encoder
