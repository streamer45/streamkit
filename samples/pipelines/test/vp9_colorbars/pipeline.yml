# Test pipeline: VP9/WebM colorbars (30 frames = 1 second at 30fps).
# Used by headless pipeline validation tests.

name: Test — VP9 Color Bars
description: Short VP9/WebM colorbars for automated testing
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 320
      height: 240
      fps: 30
      frame_count: 30
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  vp9_encoder:
    kind: video::vp9::encoder
    needs: colorbars

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 320
      video_height: 240
      streaming_mode: live
    needs: vp9_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: pacer
