# Test pipeline: WAV demux → Opus encode → Ogg mux.
# Exercises: wav demuxer (symphonia) → opus encoder → ogg muxer
# Used by headless pipeline validation tests.

name: Test — WAV Decode to Opus/Ogg
description: Demuxes uploaded WAV, encodes to Opus, muxes into Ogg
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/wav"
  output:
    type: audio

nodes:
  http_input:
    kind: streamkit::http_input

  wav_demuxer:
    kind: containers::wav::demuxer
    needs: http_input

  opus_encoder:
    kind: audio::opus::encoder
    needs: wav_demuxer

  ogg_muxer:
    kind: containers::ogg::muxer
    params:
      channels: 1
      chunk_size: 65536
    needs: opus_encoder

  http_output:
    kind: streamkit::http_output
    needs: ogg_muxer
