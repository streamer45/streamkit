# Expected output metadata for nv_av1_colorbars.yml
# Requires: skit built with --features nvcodec + NVIDIA GPU

requires_node = "video::nv::av1_encoder"
output_extension = ".webm"
codec_name = "av1"
width = 320
height = 240
container_format = "matroska,webm"
pix_fmt = "yuv420p"
