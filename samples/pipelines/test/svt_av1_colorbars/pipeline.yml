# Test pipeline: SVT-AV1/WebM colorbars (30 frames = 1 second at 30fps).
# Used by headless pipeline validation tests.
#
# Requires: skit built with --features svt_av1

name: Test — SVT-AV1 Color Bars
description: Short SVT-AV1/WebM colorbars for automated testing
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 320
      height: 240
      fps: 30
      frame_count: 30
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  svt_av1_encoder:
    kind: video::svt_av1::encoder
    params:
      preset: 12
      low_latency: true
    needs: colorbars

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 320
      video_height: 240
      streaming_mode: live
    needs: svt_av1_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="av01.0.08M.08"'
    needs: pacer
