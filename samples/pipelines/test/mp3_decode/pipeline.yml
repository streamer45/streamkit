# Test pipeline: MP3 decode → Opus encode → Ogg mux.
# Exercises: mp3 decoder (symphonia) → opus encoder → ogg muxer
# Used by headless pipeline validation tests.

name: Test — MP3 Decode to Opus/Ogg
description: Decodes uploaded MP3, encodes to Opus, muxes into Ogg
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/mpeg"
  output:
    type: audio

nodes:
  http_input:
    kind: streamkit::http_input

  mp3_decoder:
    kind: audio::mp3::decoder
    needs: http_input

  opus_encoder:
    kind: audio::opus::encoder
    needs: mp3_decoder

  ogg_muxer:
    kind: containers::ogg::muxer
    params:
      channels: 1
      chunk_size: 65536
    needs: opus_encoder

  http_output:
    kind: streamkit::http_output
    needs: ogg_muxer
