# Test pipeline: FLAC decode → Opus encode → Ogg mux.
# Exercises: flac decoder (symphonia) → opus encoder → ogg muxer
# Used by headless pipeline validation tests.

name: Test — FLAC Decode to Opus/Ogg
description: Decodes uploaded FLAC, encodes to Opus, muxes into Ogg
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/flac"
  output:
    type: audio

nodes:
  http_input:
    kind: streamkit::http_input

  flac_decoder:
    kind: audio::flac::decoder
    needs: http_input

  opus_encoder:
    kind: audio::opus::encoder
    needs: flac_decoder

  ogg_muxer:
    kind: containers::ogg::muxer
    params:
      channels: 1
      chunk_size: 65536
    needs: opus_encoder

  http_output:
    kind: streamkit::http_output
    needs: ogg_muxer
