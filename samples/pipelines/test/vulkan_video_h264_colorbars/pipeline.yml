# Test pipeline: Vulkan Video H.264/MP4 colorbars (30 frames = 1 second at 30fps).
# Used by headless pipeline validation tests.
#
# Requires: skit built with --features vulkan_video
#           Vulkan-capable GPU with H.264 encode support

name: Test — Vulkan Video H.264 Color Bars
description: Short Vulkan Video H.264/MP4 colorbars for automated testing
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 320
      height: 240
      fps: 30
      frame_count: 30
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  vk_h264_encoder:
    kind: video::vulkan_video::h264_encoder
    params:
      bitrate: 1000000
      framerate: 30
    needs: colorbars

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: stream
      video_width: 320
      video_height: 240
    needs: vk_h264_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/mp4; codecs="avc1.42c01f"'
    needs: mp4_muxer
