# Demonstrates the object store writer node with audio transcoding.
#
# Transcodes an uploaded Ogg/Opus file to MP4 (Opus-in-MP4) and uploads
# the result to S3-compatible object storage.
#
# Requires:
#   - S3-compatible endpoint (e.g. RustFS via docker/docker-compose.rustfs.yml)
#   - Set SK_S3_ACCESS_KEY and SK_S3_SECRET_KEY env vars

name: Transcode to S3 (Ogg → MP4)
description: Transcodes uploaded Ogg/Opus audio to MP4 and uploads to S3-compatible storage
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/opus"
  output:
    type: none
nodes:
  http_input:
    kind: streamkit::http_input

  ogg_demuxer:
    kind: containers::ogg::demuxer
    needs: http_input

  opus_decoder:
    kind: audio::opus::decoder
    needs: ogg_demuxer

  opus_encoder:
    kind: audio::opus::encoder
    needs: opus_decoder

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: file
      sample_rate: 48000
      channels: 2
    needs: opus_encoder

  s3_writer:
    kind: core::object_store_writer
    params:
      endpoint: "http://localhost:9000"
      bucket: "streamkit-output"
      key: "transcode/output.mp4"
      region: "us-east-1"
      access_key_id_env: "SK_S3_ACCESS_KEY"
      secret_key_env: "SK_S3_SECRET_KEY"
      content_type: "audio/mp4"
    needs: mp4_muxer
