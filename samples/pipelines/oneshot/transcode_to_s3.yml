# Demonstrates the object store writer node with audio transcoding.
#
# Transcodes an uploaded Ogg/Opus file to MP4 (Opus-in-MP4), uploads it to
# S3-compatible object storage, and returns the result to the client via HTTP.
#
# The s3_writer node uses passthrough mode so it sits inline in the linear
# pipeline: mp4_muxer → s3_writer → http_output.  Oneshot pipelines do not
# support fan-out, so every node must have at most one downstream consumer.
#
# Requires:
#   - S3-compatible endpoint (e.g. RustFS via docker/docker-compose.rustfs.yml)
#   - Set SK_S3_ACCESS_KEY and SK_S3_SECRET_KEY env vars

name: Transcode to S3 (Ogg → MP4)
description: Transcodes uploaded Ogg/Opus audio to MP4, uploads to S3, and returns the result
category: Audio Processing
tags:
  - transcoding
  - archival
  - muxing
keywords:
  - s3
  - object storage
  - transcode
  - mp4
  - archive
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/ogg"
  output:
    type: audio
nodes:
  http_input:
    kind: streamkit::http_input

  ogg_demuxer:
    kind: containers::ogg::demuxer
    needs: http_input

  opus_decoder:
    kind: audio::opus::decoder
    needs: ogg_demuxer

  opus_encoder:
    kind: audio::opus::encoder
    needs: opus_decoder

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: file
      sample_rate: 48000
      channels: 2
    needs: opus_encoder

  # S3 upload (passthrough: data flows through to http_output)
  s3_writer:
    kind: core::object_store_writer
    params:
      endpoint: "http://localhost:9000"
      bucket: "streamkit-output"
      # NOTE: Static key — every run overwrites the previous file.
      # A future enhancement could support template variables for unique keys.
      key: "transcode/output.mp4"
      region: "us-east-1"
      access_key_id_env: "SK_S3_ACCESS_KEY"
      secret_key_env: "SK_S3_SECRET_KEY"
      content_type: "audio/mp4"
      passthrough: true
    needs: mp4_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'audio/mp4; codecs="opus"'
    needs: s3_writer
