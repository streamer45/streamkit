# Demonstrates the video::openh264::encoder node:
#   Generates SMPTE color bars (I420), encodes to H.264 via OpenH264,
#   and writes the raw Annex B bitstream to an HTTP output (3 seconds).

name: OpenH264 Encode Test
description: Generates color bars and encodes to H.264 using OpenH264 (Constrained Baseline)
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 90
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  h264_encoder:
    kind: video::openh264::encoder
    params:
      bitrate_kbps: 2000
      max_frame_rate: 30.0
    needs: colorbars

  pacer:
    kind: core::pacer
    needs: h264_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/h264'
    needs: pacer
