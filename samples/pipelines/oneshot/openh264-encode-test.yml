# Demonstrates the video::openh264::encoder node:
#   Generates SMPTE color bars (NV12), encodes to H.264 via OpenH264,
#   muxes into an MP4 container, and writes the result to HTTP output.

name: OpenH264 Encode Test (MP4)
description: Generates color bars, encodes to H.264 using OpenH264, and muxes into MP4
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 90
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  h264_encoder:
    kind: video::openh264::encoder
    params:
      bitrate_kbps: 2000
      max_frame_rate: 30.0
    needs: colorbars

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: stream
      video_width: 640
      video_height: 480
    needs: h264_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/mp4; codecs="avc1"'
    needs: mp4_muxer
