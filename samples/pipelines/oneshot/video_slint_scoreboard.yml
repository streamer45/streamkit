# Demonstrates a Slint scoreboard composited onto colorbars.
#
# The scoreboard is a standalone video::slint source node that renders
# RGBA8 frames via the slint-interpreter software renderer.  Its output
# is wired into the compositor as a regular video layer — no special
# integration in the compositor itself.
#
# Requires: cargo build --features slint
#
# Base properties set the initial state; the clock ticks automatically
# once per second from `clock_start`.  `property_keyframes` cycles the
# score every ~3 s so the output is not 100 % static.
# For runtime updates see the dynamic/video_moq_slint_scoreboard.yml pipeline.

name: Video Slint Scoreboard (Oneshot)
description: Composites colorbars with a Slint scoreboard overlay, encodes to VP9, and streams a WebM via http_output
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      frame_count: 300
      pixel_format: rgba8
      draw_time: true
      draw_time_use_pts: true

  scoreboard:
    kind: video::slint
    params:
      width: 420
      height: 80
      fps: 30
      frame_count: 300
      slint_file: samples/slint/scoreboard.slint
      properties:
        home_team: "EAGLES"
        away_team: "HAWKS"
        home_score: 3
        away_score: 1
        clock_start: 754
        period: "2ND"
      keyframe_interval: 90
      property_keyframes:
        - home_score: 3
          away_score: 1
        - home_score: 3
          away_score: 2
        - home_score: 4
          away_score: 2

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 430
            y: 20
            width: 420
            height: 80
          opacity: 1.0
          z_index: 10
    needs:
      - colorbars_bg
      - scoreboard

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 1280
      video_height: 720
      streaming_mode: live
    needs: vp9_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: pacer
