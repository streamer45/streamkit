# Demonstrates a Slint scoreboard overlay composited onto colorbars.
#
# The scoreboard is rendered via the slint-interpreter software renderer
# and composited as a standard DecodedOverlay — zero changes to the
# compositing kernel.
#
# Requires: cargo build --features slint_overlay
#
# Properties are set statically here.  For runtime updates see the
# dynamic/video_moq_slint_scoreboard.yml pipeline.

name: Video Slint Scoreboard (Oneshot)
description: Composites colorbars with a Slint scoreboard overlay, encodes to VP9, and streams a WebM via http_output
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      frame_count: 300
      pixel_format: rgba8
      draw_time: true
      draw_time_use_pts: true

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 1
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
      slint_overlays:
        - id: scoreboard
          slint_file: samples/slint/scoreboard.slint
          rect:
            x: 430
            y: 20
            width: 420
            height: 80
          opacity: 1.0
          z_index: 10
          properties:
            home_team: "EAGLES"
            away_team: "HAWKS"
            home_score: 3
            away_score: 1
            clock: "12:34"
            period: "2ND"
    needs:
      - colorbars_bg

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 1280
      video_height: 720
      streaming_mode: live
    needs: vp9_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: pacer
