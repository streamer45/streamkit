name: Text-to-Speech (Pocket TTS Voice Clone)
description: Synthesizes speech from text using Pocket TTS with a voice prompt WAV
mode: oneshot
client:
  input:
    type: text
    field_hints:
      voice:
        type: file
        accept: "audio/wav"
      text:
        type: text
        placeholder: "Enter text to synthesize"
  output:
    type: audio
nodes:
  uploads:
    kind: streamkit::http_input
    params:
      fields:
        - name: voice
          required: false
        - name: text

  text_chunker:
    kind: core::text_chunker
    params:
      min_length: 10
    needs: uploads.text

  pocket_tts:
    kind: plugin::native::pocket-tts
    params:
      weights_path: "models/pocket-tts/tts_b6369a24.safetensors"
      tokenizer_path: "models/pocket-tts/tokenizer.model"
      voice_embeddings_dir: "models/pocket-tts/embeddings"
      temperature: 0.7
      lsd_decode_steps: 1
      eos_threshold: -4.0
    needs:
      - text_chunker
      - uploads.voice

  resampler:
    kind: audio::resampler
    params:
      chunk_frames: 960
      output_frame_size: 960
      target_sample_rate: 48000
    needs: pocket_tts

  opus_encoder:
    kind: audio::opus::encoder
    needs: resampler

  webm_muxer:
    kind: containers::webm::muxer
    params:
      channels: 1
      sample_rate: 48000
      streaming_mode: live
    needs: opus_encoder

  http_output:
    kind: streamkit::http_output
    needs: webm_muxer
