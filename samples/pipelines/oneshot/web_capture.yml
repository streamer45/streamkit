# Render a web page to a short VP9/WebM video using the Servo web engine.
#
# Captures 30 frames (1 second at 30 fps) of the given URL and streams the
# result via http_output as a WebM container.
#
# Requires: plugin::native::servo loaded
#   just build-plugin-native-servo && just copy-plugins-native

name: Web Page Capture (Servo)
description: Renders a web page via the Servo engine and outputs a short VP9/WebM clip
category: Web Capture
tags:
  - web-capture
  - video-encoding
keywords:
  - servo
  - web
  - browser
  - render
  - vp9
  - webm
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  web:
    kind: plugin::native::servo
    params:
      url: "https://streamkit.dev"
      width: 1280
      height: 720
      fps: 30
      frame_count: 30

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: web

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 1280
      video_height: 720
      streaming_mode: live
    needs: vp9_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: webm_muxer
