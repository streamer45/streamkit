# Demonstrates the object store writer node with TTS output.
#
# Synthesizes speech from text using Kokoro TTS, encodes to Opus/OGG,
# uploads it to S3-compatible object storage, and returns the result to
# the client via HTTP.
#
# The s3_writer node uses passthrough mode so it sits inline in the linear
# pipeline: ogg_muxer → s3_writer → http_output.  Oneshot pipelines do not
# support fan-out, so every node must have at most one downstream consumer.
#
# Requires:
#   - kokoro native plugin (just install-plugin kokoro)
#   - S3-compatible endpoint (e.g. RustFS via docker/docker-compose.rustfs.yml)
#   - Set SK_S3_ACCESS_KEY and SK_S3_SECRET_KEY env vars

name: TTS to S3 (Kokoro)
description: Synthesizes speech from text, uploads OGG audio to S3, and returns the result
category: Text to Speech
tags:
  - text-to-speech
  - archival
keywords:
  - tts
  - s3
  - object storage
  - kokoro
  - archive
mode: oneshot
client:
  input:
    type: text
    placeholder: "Enter text to synthesize"
  output:
    type: audio
nodes:
  http_input:
    kind: streamkit::http_input

  text_chunker:
    kind: core::text_chunker
    params:
      min_length: 10
    needs: http_input

  tts:
    kind: plugin::native::kokoro
    params:
      model_dir: "models/kokoro-multi-lang-v1_1"
      speaker_id: 0
      speed: 1.0
    needs: text_chunker

  resampler:
    kind: audio::resampler
    params:
      chunk_frames: 960
      output_frame_size: 960
      target_sample_rate: 48000
    needs: tts

  opus_encoder:
    kind: audio::opus::encoder
    needs: resampler

  ogg_muxer:
    kind: containers::ogg::muxer
    params:
      channels: 1
    needs: opus_encoder

  # S3 upload (passthrough: data flows through to http_output)
  s3_writer:
    kind: core::object_store_writer
    params:
      endpoint: "http://localhost:9000"
      bucket: "streamkit-output"
      # NOTE: Static key — every run overwrites the previous file.
      # A future enhancement could support template variables for unique keys.
      key: "tts/output.ogg"
      region: "us-east-1"
      access_key_id_env: "SK_S3_ACCESS_KEY"
      secret_key_env: "SK_S3_SECRET_KEY"
      content_type: "audio/ogg"
      passthrough: true
    needs: ogg_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: "audio/ogg"
    needs: s3_writer
