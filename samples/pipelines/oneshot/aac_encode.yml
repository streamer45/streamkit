# Demonstrates the AAC encoder native plugin (audio-only).
#
# Takes an uploaded Ogg/Opus file, decodes it to PCM, encodes to AAC-LC
# using the aac-encoder native plugin, muxes into an MP4 container, and
# writes the result to HTTP output.
#
# Requires: aac-encoder native plugin (just install-plugin aac-encoder)

name: AAC Encode (audio-only, MP4)
description: Decodes an uploaded Ogg/Opus file, encodes to AAC-LC, and muxes into MP4
category: Audio Processing
tags:
  - audio-encoding
keywords:
  - aac
  - encode
  - mp4
  - audio
mode: oneshot
client:
  input:
    type: file_upload
    accept: "audio/opus"
  output:
    type: audio

nodes:
  http_input:
    kind: streamkit::http_input

  ogg_demuxer:
    kind: containers::ogg::demuxer
    needs: http_input

  opus_decoder:
    kind: audio::opus::decoder
    needs: ogg_demuxer

  aac_encoder:
    kind: plugin::native::aac_encoder
    params:
      bitrate: 128000
    needs: opus_decoder

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: stream
      sample_rate: 48000
      channels: 2
      audio_codec: aac
    needs: aac_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'audio/mp4; codecs="mp4a.40.2"'
    needs: mp4_muxer
