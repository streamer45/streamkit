name: Video Color Bars (VP9/WebM)
description: Generates SMPTE color bars, encodes to VP9, and outputs a WebM file (30 seconds)
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      frame_count: 900  # 30 seconds at 30fps
      pixel_format: nv12
      draw_time: true
      draw_time_use_pts: true

  vp9_encoder:
    kind: video::vp9::encoder
    needs: colorbars

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 1280
      video_height: 720
      streaming_mode: live
    needs: vp9_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: webm_muxer
