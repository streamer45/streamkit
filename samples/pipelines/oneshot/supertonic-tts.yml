name: Text-to-Speech (Supertonic)
description: Synthesizes speech from text using Supertonic (5 languages, 10 voice styles)
mode: oneshot
attributes:
  service: tts
client:
  input:
    type: text
    placeholder: "Enter text to synthesize"
  output:
    type: audio
steps:
  - kind: streamkit::http_input
  - kind: core::text_chunker
    params:
      min_length: 10
  - kind: plugin::native::supertonic
    params:
      model_dir: "models/supertonic-v2-onnx"
      lang: "en"
      voice_style: "M1"
      total_step: 5
      speed: 1.05
      silence_duration: 0.3
  - kind: audio::resampler
    params:
      chunk_frames: 960
      output_frame_size: 960
      target_sample_rate: 48000
  - kind: audio::opus::encoder
  - kind: containers::webm::muxer
    params:
      channels: 1
      sample_rate: 48000
      streaming_mode: live
  - kind: streamkit::http_output
