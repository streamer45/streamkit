name: Text-to-Speech (Kokoro)
description: Synthesizes speech from text using Kokoro
group: text-to-speech
variant: Kokoro
canonical: true
category: Text to Speech
tags:
  - text-to-speech
keywords:
  - tts
  - speech synthesis
  - synthesize
  - voice
  - kokoro
mode: oneshot
client:
  input:
    type: text
    placeholder: "Enter text to synthesize"
  output:
    type: audio
steps:
  - kind: streamkit::http_input
  - kind: core::text_chunker
    params:
      min_length: 10
  - kind: plugin::native::kokoro
    params:
      model_dir: "models/kokoro-multi-lang-v1_1"
      speaker_id: 0
      speed: 1.0
      num_threads: 4
  - kind: audio::resampler
    params:
      chunk_frames: 960
      output_frame_size: 960
      target_sample_rate: 48000
  - kind: audio::opus::encoder
  - kind: containers::webm::muxer
    params:
      channels: 1
      sample_rate: 48000
      streaming_mode: live
  - kind: streamkit::http_output
