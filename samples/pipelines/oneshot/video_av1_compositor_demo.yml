# Demonstrates the video::compositor node with AV1 encoding (rav1e):
#   1. A full-size 640x480 background colorbars (RGBA8)
#   2. A smaller 240x180 PiP colorbars overlay (RGBA8) with 15° rotation
#   3. A text overlay ("StreamKit AV1 Demo")
#   4. The StreamKit logo as a semi-transparent watermark
#
# NOTE: AV1 (rav1e speed=10) is single-thread-bound and can only sustain
# real-time 30 fps at 640x480 on current hardware.  This pipeline uses
# 640x480 to stay within that budget.

name: Video Compositor Demo (AV1)
description: Composites two colorbars sources (main + PiP) with a text overlay and logo watermark, encodes to AV1, and streams a WebM via http_output (3 seconds)
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 90
      pixel_format: rgba8
      draw_time: true
      draw_time_use_pts: true

  colorbars_pip:
    kind: video::colorbars
    params:
      width: 240
      height: 180
      fps: 30
      frame_count: 90
      pixel_format: rgba8
      draw_time: true
      draw_time_use_pts: true

  compositor:
    kind: video::compositor
    params:
      width: 640
      height: 480
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 50
            y: 150
            width: 240
            height: 180
          opacity: 0.9
          z_index: 1
          rotation_degrees: 15.0
      text_overlays:
        - id: "title"
          text: "StreamKit AV1 Demo"
          rect:
            x: 20
            y: 20
            width: 300
            height: 30
          color: [255, 255, 255, 230]
          font_size: 24
          opacity: 1.0
          rotation_degrees: 0.0
          z_index: 2
          font_name: samples/fonts/system/DejaVuSans.ttf
      image_overlays:
        - id: logo
          asset_path: samples/images/system/streamkit-logo.png
          rect:
            x: 590
            y: 395
            width: 23
            height: 40
          opacity: 0.7
          z_index: 3
    needs:
      - colorbars_bg
      - colorbars_pip

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  av1_encoder:
    kind: video::av1::encoder
    params:
      speed: 10
      low_latency: true
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 640
      video_height: 480
      streaming_mode: live
    needs: av1_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      # Explicit override required: the WebM muxer's static content_type()
      # hint defaults to VP9 because the video codec is unknown at config
      # time (resolved at runtime from the first video packet).  The oneshot
      # backward walk would otherwise set the HTTP response to "video/webm;
      # codecs="vp9,opus"" which is incorrect for AV1 output.
      content_type: 'video/webm; codecs="av1"'
    needs: pacer
