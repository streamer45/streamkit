# Demonstrates the MP4 muxer node in file mode with AV1 video.
#
# Generates colorbars, encodes to AV1 via SVT-AV1, and muxes into a regular
# MP4 container (AV1-in-MP4 per ISO 14496-12 / AV1-ISOBMFF spec).

name: MP4 Mux (AV1 video, file mode)
description: Encode colorbars to AV1 and mux into an MP4 file
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 900
      pixel_format: rgba8
      draw_time: true

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: colorbars

  av1_encoder:
    kind: video::svt_av1::encoder
    params:
      preset: 12
      low_latency: true
    needs: pixel_convert

  mp4_muxer:
    kind: containers::mp4::muxer
    params:
      mode: file
      video_width: 640
      video_height: 480
    needs: av1_encoder

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/mp4; codecs="av01.0.04M.08"'
    needs: mp4_muxer
