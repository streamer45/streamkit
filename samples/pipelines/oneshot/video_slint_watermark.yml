# Demonstrates a Slint watermark composited onto colorbars.
#
# The watermark is a standalone video::slint source node that renders
# RGBA8 frames via the slint-interpreter software renderer.  Its output
# is wired into the compositor as a regular video layer — no special
# integration in the compositor itself.
#
# Requires: cargo build --features slint
#
# For runtime property updates see the dynamic/video_moq_slint_scoreboard.yml
# pipeline which uses the scoreboard overlay in real-time mode.

name: Video Slint Watermark (Oneshot)
description: Composites colorbars with a Slint watermark overlay, encodes to VP9, and streams a WebM via http_output
mode: oneshot
client:
  input:
    type: none
  output:
    type: video

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      frame_count: 300
      pixel_format: rgba8
      draw_time: true
      draw_time_use_pts: true

  watermark:
    kind: video::slint
    params:
      width: 180
      height: 44
      fps: 30
      frame_count: 300
      slint_file: samples/slint/watermark.slint
      static_ui: true
      properties:
        channel: "StreamKit"
        tagline: "LIVE"

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 1080
            y: 20
            width: 180
            height: 44
          opacity: 0.9
          z_index: 10
    needs:
      - colorbars_bg
      - watermark

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    needs: pixel_convert

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 1280
      video_height: 720
      streaming_mode: live
    needs: vp9_encoder

  pacer:
    kind: core::pacer
    needs: webm_muxer

  http_output:
    kind: streamkit::http_output
    params:
      content_type: 'video/webm; codecs="vp9"'
    needs: pacer
