# NOTE: Text/image overlays can be configured at runtime via UpdateParams.
# Deeply nested params (e.g. text_overlays with rect objects) trigger a
# serde_saphyr parsing limitation with untagged enums, so they are omitted
# from this static YAML sample.

name: Video Compositor Demo
description: Generates SMPTE color bars, composites them through the compositor node, encodes to VP9, and outputs a WebM file (3 seconds)
mode: oneshot

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 90  # 3 seconds at 30fps

  compositor:
    kind: video::compositor
    params:
      width: 640
      height: 480
      num_inputs: 1
      output_pixel_format: i420
    needs: colorbars

  vp9_encoder:
    kind: video::vp9::encoder
    needs: compositor

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 640
      video_height: 480
      streaming_mode: live
    needs: vp9_encoder

  http_output:
    kind: streamkit::http_output
    needs: webm_muxer
