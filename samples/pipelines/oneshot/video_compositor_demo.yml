name: Video Compositor Demo
description: >
  Generates SMPTE color bars, composites them through the compositor node
  with a text overlay, encodes to VP9, and outputs a WebM file (3 seconds).
mode: oneshot

nodes:
  colorbars:
    kind: video::colorbars
    params:
      width: 640
      height: 480
      fps: 30
      frame_count: 90  # 3 seconds at 30fps

  compositor:
    kind: video::compositor
    params:
      width: 640
      height: 480
      text_overlays:
        - text: "StreamKit Compositor"
          rect:
            x: 10
            y: 10
            width: 300
            height: 30
          color: [255, 255, 255, 255]
          font_size: 24
          opacity: 0.8
    needs:
      in_0: colorbars

  vp9_encoder:
    kind: video::vp9::encoder
    needs: compositor

  webm_muxer:
    kind: containers::webm::muxer
    params:
      video_width: 640
      video_height: 480
      streaming_mode: live
    needs: vp9_encoder

  http_output:
    kind: streamkit::http_output
    needs: webm_muxer
