[package]
name = "streamkit-nodes"
version = "0.2.0"
edition = "2021"
authors = ["Claudio Costa <cstcld91@gmail.com>", "StreamKit Contributors"]
description = "Built-in processing nodes for StreamKit"
homepage = "https://github.com/streamer45/streamkit"
repository = "https://github.com/streamer45/streamkit"
license = "MPL-2.0"
keywords = ["audio", "nodes", "codecs", "streaming", "processing"]
categories = ["multimedia", "network-programming"]
readme = "README.md"
publish = false
autobenches = false

[dependencies]
# Skit's core library
streamkit-core = { workspace = true }

tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-util = { workspace = true }

bytes = { workspace = true }

# For async traits
async-trait = { workspace = true }

# For configuration deserialization
serde = { workspace = true, features = ["derive"] }
serde-saphyr = { workspace = true }

# For logging within nodes
tracing = { workspace = true }

# For OpenTelemetry OTLP integration
opentelemetry = { workspace = true, features = ["metrics", "trace"] }
schemars = { version = "1.2.0", features = ["derive"], optional = true }

# For the mixer's concurrent input handling
futures = { workspace = true }

# --- Optional Dependencies ---
# These are only included if their corresponding feature is enabled.
ogg = { version = "0.9.2", optional = true, features = ["async"] }
opus = { version = "0.3.1", optional = true }
url = { version = "2.5.8", optional = true, features = ["serde"] }
rquickjs = { version = "0.11", features = ["array-buffer", "futures", "loader", "parallel"], optional = true }
wildmatch = { version = "2.6", optional = true }

moq-native = { version = "0.13.6", optional = true }
moq-lite = { version = "0.15.5", optional = true }
hang = { version = "0.15.4", optional = true }

# For local dev, debugging moq stuff
# moq-native = { path = "../../moq/rs/moq-native", optional = true }
# moq-lite = { path = "../../moq/rs/moq", optional = true }
# hang = { path = "../../moq/rs/hang", optional = true }

serde_json = { version = "1.0", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = [
  "rustls",
  "stream",
] }
tempfile = { version = "3.27", optional = true }
uuid = { version = "1", optional = true, features = ["v4"] }
rubato = { version = "1.0", optional = true }
audioadapter-buffers = { version = "2.0", optional = true }
symphonia = { version = "0.5.5", optional = true, default-features = false, features = [
  "mp3",
  "wav",
  "flac",
  "pcm",
  "ogg",
] }
webm = { version = "2.2.0", optional = true }
shiguredo_mp4 = { version = "2026.3", optional = true }
env-libvpx-sys = { version = "5.1.3", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png", "jpeg"] }
tiny-skia = { version = "0.12.0", optional = true }
resvg = { version = "0.47", optional = true, default-features = false }
base64 = { version = "0.22", optional = true }
rayon = { version = "1.10", optional = true }
fontdue = { version = "0.9", optional = true }
smallvec = { version = "1.13", optional = true, features = ["serde"] }
ts-rs = { version = "12.0.1", optional = true }

# H.264 codec via Cisco's OpenH264 (optional, behind `openh264` feature)
openh264 = { version = "0.9", optional = true }

# RTMP publishing (optional, behind `rtmp` feature)
shiguredo_rtmp = { version = "2026.1.0-canary.5", optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["std"] }
rustls-platform-verifier = { version = "0.5", optional = true }

# AV1 codec (optional, behind `av1` feature)
rav1e = { version = "0.8", optional = true, default-features = false, features = ["threading", "asm"] }
rav1d = { version = "1.1", optional = true, default-features = false, features = ["bitdepth_8", "bitdepth_16", "asm"] }

# GPU compositing (optional, behind `gpu` feature)
wgpu = { version = "29", optional = true, default-features = false, features = ["vulkan", "metal", "dx12", "wgsl"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.22", optional = true, features = ["derive"] }

futures-util = "0.3"

[features]
default = [
  "passthrough",
  "audio_gain",
  "audio_mixer",
  "audio_resampler",
  "audio_pacer",
  "opus",
  "ogg",
  "webm",
  "moq",
  "file_io",
  "pacer",
  "http",
  "symphonia",
  "script",
  "video",
  "mp4",
  "openh264",
  "rtmp",
]

# Individual features for each node.
passthrough = ["dep:schemars"]
audio_gain = ["dep:schemars"]
audio_mixer = ["dep:schemars", "dep:serde_json"]
audio_resampler = ["dep:schemars", "dep:rubato", "dep:audioadapter-buffers"]
audio_pacer = ["dep:schemars"]
file_io = ["dep:schemars"]
pacer = ["dep:schemars"]
http = ["dep:schemars", "dep:reqwest", "dep:tempfile"]
script = ["dep:rquickjs", "dep:reqwest", "dep:wildmatch", "dep:schemars", "dep:serde_json", "dep:url", "dep:uuid"]
moq = [
  "dep:schemars",
  "dep:url",
  "dep:moq-native",
  "dep:moq-lite",
  "dep:hang",
  "dep:serde_json",
]

# Codecs and Containers
# The `dep:` syntax enables the optional dependency when the feature is active.
opus = ["dep:opus", "dep:schemars"]
ogg = ["dep:ogg", "dep:schemars"]
webm = ["dep:webm", "dep:schemars", "dep:tempfile"]
mp4 = ["dep:shiguredo_mp4", "dep:schemars", "dep:tempfile", "dep:serde_json"]
symphonia = ["dep:symphonia", "dep:schemars"]
vp9 = ["dep:env-libvpx-sys", "dep:schemars"]
av1 = ["dep:rav1e", "dep:rav1d", "dep:schemars"]
openh264 = ["dep:openh264", "dep:schemars", "dep:serde_json"]
rtmp = ["dep:shiguredo_rtmp", "dep:tokio-rustls", "dep:rustls", "dep:rustls-platform-verifier", "dep:schemars", "dep:serde_json"]
svt_av1 = ["dep:schemars", "dep:serde_json", "dep:pkg-config", "dep:cc"]
# svt_av1_static downloads + builds SVT-AV1 at compile time (no system install).
# Not in `default` to keep dev builds fast; enabled explicitly in Dockerfiles and
# release.yml so every shipped artifact includes AV1 encoding.
svt_av1_static = ["svt_av1", "dep:cmake"]
dav1d = ["dep:schemars", "dep:serde_json", "dep:pkg-config", "dep:cc"]
# dav1d_static downloads + builds dav1d at compile time via meson + ninja
# (no system install).  Mirrors the svt_av1_static pattern.
dav1d_static = ["dav1d"]
colorbars = ["dep:schemars", "dep:serde_json", "dep:fontdue"]
compositor = ["dep:schemars", "dep:serde_json", "dep:image", "dep:tiny-skia", "dep:rayon", "dep:fontdue", "dep:smallvec", "dep:uuid", "dep:resvg"]
gpu = ["compositor", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
codegen = ["dep:ts-rs"]
video = ["vp9", "av1", "openh264", "colorbars", "compositor"]

[[bin]]
name = "generate-compositor-types"
path = "src/bin/generate_compositor_types.rs"
required-features = ["codegen", "compositor"]

[build-dependencies]
pkg-config = { version = "0.3", optional = true }
cc = { version = "1.2", optional = true }
cmake = { version = "0.1", optional = true }

[dev-dependencies]
tempfile = "3.27"
axum = "0.8"
tower = "0.5.3"
serde_json = "1.0"

[[bench]]
name = "rav1e_standalone"
harness = false
required-features = ["av1"]

[[bench]]
name = "svt_av1_standalone"
harness = false
required-features = ["svt_av1"]

[lints.rust]
# Override workspace `forbid` → `deny` so the video module can `#![allow(unsafe_code)]`
# for SIMD intrinsics and libvpx FFI. All other code in this crate remains deny.
unsafe_code = "deny"

[lints.clippy]
# Kept in sync with [workspace.lints.clippy] — cannot use `workspace = true`
# here because [lints.rust] already overrides the workspace rust lints.
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cognitive_complexity = "warn"
cast_possible_truncation = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
