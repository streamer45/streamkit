name: Webcam Circle PiP (MoQ Stream)
description: Composites the user's webcam as a circular picture-in-picture overlay over colorbars
mode: dynamic

nodes:
  colorbars_bg:
    kind: video::colorbars
    params:
      width: 1280
      height: 720
      fps: 30
      draw_time: true

  moq_peer:
    kind: transport::moq::peer
    params:
      gateway_path: /moq/video
      input_broadcasts:
        - input
      output_broadcast: output
      allow_reconnect: true
    needs:
      in: opus_encoder
      in_1: vp9_encoder

  vp9_decoder:
    kind: video::vp9::decoder
    needs:
      in: moq_peer.video/data

  compositor:
    kind: video::compositor
    params:
      width: 1280
      height: 720
      num_inputs: 2
      layers:
        in_0:
          opacity: 1.0
          z_index: 0
        in_1:
          rect:
            x: 1050
            y: 490
            width: 200
            height: 200
          opacity: 1.0
          z_index: 1
          crop_zoom: 1.8
          crop_x: 0.5
          crop_y: 0.4
          crop_shape: circle
      text_overlays:
        - text: 'Hello from StreamKit'
          rect:
            x: 40
            y: 660
            width: 400
            height: 40
          opacity: 1.0
          z_index: 2
          color: [255, 255, 255, 220]
          font_size: 28
          font_name: dejavu-sans-bold
    needs:
      - colorbars_bg
      - vp9_decoder

  pixel_convert:
    kind: video::pixel_convert
    params:
      output_format: nv12
    needs: compositor

  vp9_encoder:
    kind: video::vp9::encoder
    params:
      keyframe_interval: 30
    needs: pixel_convert

  opus_decoder:
    kind: audio::opus::decoder
    needs:
      in: moq_peer.audio/data

  gain:
    kind: audio::gain
    params:
      gain: 1.0
    needs: opus_decoder

  opus_encoder:
    kind: audio::opus::encoder
    needs: gain
